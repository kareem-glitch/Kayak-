[package]
name = "soundstudio"
version = "0.1.0"
edition = "2021"
description = "SoundStudio desktop: the jam room with native, low-latency audio"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cpal = "0.16"
crossbeam-channel = "0.5"
tungstenite = "0.24"
serde_json = "1"
ssengine = { path = "../engine" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
