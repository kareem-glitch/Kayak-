[package]
name = "soundstudio"
version = "0.6.4"
edition = "2021"
description = "air.band desktop: the jam room with native, low-latency audio"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
cpal = "0.16"
crossbeam-channel = "0.5"
tungstenite = "0.24"
ureq = { version = "2", features = ["native-certs"] }
serde_json = "1"
ssengine = { path = "../engine" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Windows: ASIO, the low-latency driver audio interfaces ship with (audio.rs)
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.16", features = ["asio"] }
