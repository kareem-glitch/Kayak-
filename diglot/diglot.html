// ── src/diglot/voice.js ───────────────────────────────────────
// Where the sound comes from.
//
// Two backends behind one interface, so the player does not care which is
// speaking: the device's own voices (free, instant, robotic) and ElevenLabs
// (a real voice, your key, a network round trip per phrase).
//
// The round trip is the whole design problem. A diglot sentence is a stream of
// short runs — "la", "casa", "house" — and fetching each one when its turn
// comes would stutter. So runs are fetched ahead of the playhead and cached by
// their text, which also means the second read of a page costs nothing.

const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';

const ELEVEN_MODELS = [
  { id: 'eleven_multilingual_v2', label: 'Multilingual v2 — best quality' },
  { id: 'eleven_turbo_v2_5', label: 'Turbo v2.5 — faster, cheaper' },
  { id: 'eleven_flash_v2_5', label: 'Flash v2.5 — fastest' },
];

/** Turbo and Flash accept a language hint; Multilingual v2 detects it itself. */
const takesLanguage = (model) => /turbo|flash/.test(model || '');

// ── the device's own voices ─────────────────────────────────────────────────

function browserEngine({ voices = {}, onWarn } = {}) {
  const synth = (() => {
    try { return typeof speechSynthesis !== 'undefined' ? speechSynthesis : null; } catch { return null; }
  })();
  const usable = (() => {
    try { return !!synth && typeof SpeechSynthesisUtterance === 'function'; } catch { return false; }
  })();
  const list = () => {
    try { return synth ? synth.getVoices() || [] : []; } catch { return []; }
  };

  function pick(lang, slot) {
    const all = list();
    const second = slot === 1 && lang === 'es' && voices.es2;
    const wanted = second || (lang === 'es' ? voices.es : voices.en);
    const voice = all.find((v) => v.name === wanted)
      || all.find((v) => v.lang.toLowerCase().startsWith(lang === 'es' ? 'es' : 'en'))
      || null;
    return { voice, pitch: slot === 1 && !second ? 0.78 : 1 };
  }

  let current = null;
  return {
    kind: 'browser',
    mergeRuns: false,
    get available() { return usable; },
    unlock() {},
    prefetch() {},
    hasSpanish: () => list().some((v) => v.lang.toLowerCase().startsWith('es')),
    describe() {
      if (!usable) return 'This browser will not let the page speak. Safari blocks it inside an embedded frame — open the page in its own tab.';
      if (!list().some((v) => v.lang.toLowerCase().startsWith('es'))) {
        return 'No Spanish voice installed — the Spanish will be read with an English accent. Add one in your system’s language settings.';
      }
      return '';
    },
    speak(run, { rate = 1 } = {}) {
      if (!usable) return Promise.resolve();
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(run.text);
        const { voice, pitch } = pick(run.lang, run.slot || 0);
        utterance.voice = voice;
        utterance.lang = voice?.lang || (run.lang === 'es' ? 'es-ES' : 'en-GB');
        utterance.rate = run.kind === 'gloss' ? Math.min(2, rate * 1.12) : rate;
        utterance.pitch = pitch;
        if (run.kind === 'gloss') utterance.volume = 0.72;
        let done = false;
        let watchdog = null;
        const finish = () => {
          if (done) return;
          done = true;
          clearTimeout(watchdog);
          resolve();
        };
        utterance.onend = finish;
        utterance.onerror = (e) => { onWarn?.(e?.error || 'speech error'); finish(); };
        current = utterance;
        try { synth.speak(utterance); } catch { finish(); }
        // Browsers drop onend more often than you would like — a phone locking,
        // a missing voice, Chrome's long-utterance bug. Move on regardless.
        const seconds = run.text.length / (11 * (utterance.rate || 1));
        watchdog = setTimeout(finish, Math.max(1200, seconds * 2200));
      });
    },
    stop() {
      current = null;
      try { synth?.cancel(); } catch { /* nothing to stop */ }
    },
  };
}

// ── ElevenLabs ──────────────────────────────────────────────────────────────

/** A small persistent cache, so a re-read costs nothing and a re-listen is instant. */
function audioStore() {
  let open = null;
  const ready = () => {
    if (open) return open;
    open = new Promise((resolve) => {
      try {
        const req = indexedDB.open('diglot-audio', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('clips');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
    return open;
  };
  return {
    async get(key) {
      const db = await ready();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const req = db.transaction('clips').objectStore('clips').get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    },
    async put(key, blob) {
      const db = await ready();
      if (!db) return;
      try {
        db.transaction('clips', 'readwrite').objectStore('clips').put(blob, key);
      } catch { /* quota, private mode */ }
    },
    async clear() {
      const db = await ready();
      if (!db) return;
      try { db.transaction('clips', 'readwrite').objectStore('clips').clear(); } catch { /* ignore */ }
    },
  };
}

/** At most `limit` requests in flight: accounts have small concurrency caps. */
function throttle(limit) {
  let active = 0;
  const queue = [];
  const next = () => {
    if (active >= limit || !queue.length) return;
    active += 1;
    const { job, resolve, reject } = queue.shift();
    job().then(resolve, reject).finally(() => { active -= 1; next(); });
  };
  return (job) => new Promise((resolve, reject) => { queue.push({ job, resolve, reject }); next(); });
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function elevenEngine({ apiKey, endpoint = '', model = ELEVEN_MODELS[0].id, voices = {}, onWarn } = {}) {
  const memory = new Map();          // key → Promise<Blob>
  const queue = throttle(3);
  const disk = audioStore();
  const audio = typeof Audio !== 'undefined' ? new Audio() : null;
  if (audio) audio.preload = 'auto';
  let currentUrl = null;
  let stopped = false;

  const voiceFor = (run) => {
    if (run.lang === 'es') return (run.slot === 1 && voices.es2) || voices.es;
    return voices.en;
  };
  const keyFor = (run) => `${model}|${voiceFor(run)}|${run.lang}|${run.text}`;

  async function request(run) {
    const voiceId = voiceFor(run);
    if (!voiceId) throw new Error(`Choose an ElevenLabs voice for ${run.lang === 'es' ? 'Spanish' : 'English'}`);
    const body = {
      text: run.text,
      model_id: model,
      voice_settings: { stability: 0.45, similarity_boost: 0.8, style: 0, use_speaker_boost: true },
    };
    if (takesLanguage(model)) body.language_code = run.lang;

    // Through our own endpoint when the site provides one (the key stays on the
    // server); straight to ElevenLabs with the user's key otherwise.
    const viaProxy = !!endpoint;
    const url = viaProxy
      ? endpoint
      : `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voiceId)}?output_format=mp3_44100_128`;
    const headers = { 'content-type': 'application/json' };
    if (!viaProxy) headers['xi-api-key'] = apiKey;

    const send = () => fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(viaProxy ? { ...body, voice_id: voiceId } : body),
    });

    let res = await queue(send);
    if (res.status === 429 || res.status >= 500) {
      // Rate limited or a wobble: one patient retry before giving up.
      await wait(res.status === 429 ? 1500 : 600);
      res = await queue(send);
    }
    if (!res.ok) {
      let detail = `${res.status} ${res.statusText}`;
      try {
        const problem = await res.json();
        detail = problem?.detail?.message || problem?.detail || problem?.error || detail;
      } catch { /* keep the status line */ }
      if (res.status === 429) detail = 'ElevenLabs is rate limiting — slow down, or use the device voices for now.';
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    return res.blob();
  }

  function clip(run) {
    const key = keyFor(run);
    if (memory.has(key)) return memory.get(key);
    const pending = (async () => {
      const saved = await disk.get(key);
      if (saved) return saved;
      const blob = await request(run);
      disk.put(key, blob);
      return blob;
    })();
    memory.set(key, pending);
    pending.catch(() => memory.delete(key));   // let a failed fetch be retried
    return pending;
  }

  return {
    kind: 'elevenlabs',
    mergeRuns: true,
    get available() { return !!audio && (!!apiKey || !!endpoint); },
    hasSpanish: () => true,
    describe() {
      if (!audio) return 'This browser cannot play audio.';
      if (!apiKey && !endpoint) return 'Add your ElevenLabs key in Settings, or switch back to the device voices.';
      if (!voices.es || !voices.en) return 'Pick an ElevenLabs voice for each language in Settings.';
      return '';
    },
    /** Must run inside the click that starts playback, or iOS will not play. */
    unlock() {
      if (!audio) return;
      stopped = false;
      try { audio.src = SILENT_WAV; audio.play().catch(() => {}); } catch { /* ignore */ }
    },
    prefetch(runs) {
      for (const run of runs.slice(0, 4)) {
        try { clip(run).catch(() => {}); } catch { /* ignore */ }
      }
    },
    async speak(run, { rate = 1 } = {}) {
      if (!audio) return;
      let blob;
      try {
        blob = await clip(run);
      } catch (err) {
        onWarn?.(err.message);
        return;
      }
      if (stopped) return;
      await new Promise((resolve) => {
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(blob);
        audio.src = currentUrl;
        audio.playbackRate = run.kind === 'gloss' ? Math.min(4, rate * 1.1) : rate;
        audio.volume = run.kind === 'gloss' ? 0.8 : 1;
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          audio.onended = null;
          audio.onerror = null;
          resolve();
        };
        audio.onended = finish;
        audio.onerror = () => { onWarn?.('could not play that clip'); finish(); };
        audio.play().catch((err) => { onWarn?.(err.message); finish(); });
      });
    },
    stop() {
      stopped = true;
      try { audio?.pause(); } catch { /* ignore */ }
    },
    clearCache: () => { memory.clear(); return disk.clear(); },
  };
}

/** Build the engine the settings ask for, falling back to the device voices. */
/**
 * Group the runs a sentence is made of into what should actually be sent to a
 * voice. The device voices are free and instant, so they take one run at a
 * time and every word can be highlighted as it is said. A remote voice is
 * neither, so runs that sit flush against each other in the same language
 * become one clip — fewer requests, and "la vieja" spoken as a phrase rather
 * than two disconnected words. The chunk remembers the runs it covers, so the
 * highlight still lands on all of them.
 */
function speechChunks(runs, { merge = false } = {}) {
  const single = (run, i) => ({ ...run, runs: [run], from: i, to: i });
  if (!merge) return runs.map(single);

  const chunks = [];
  runs.forEach((run, i) => {
    const last = chunks[chunks.length - 1];
    const joinable = last
      && last.lang === run.lang
      && last.kind === run.kind
      && last.speaker === run.speaker
      && !last.gapAfter;
    if (!joinable) { chunks.push(single(run, i)); return; }
    const glue = /^[\s,.;:!?…]/.test(run.text) || /\s$/.test(last.text) ? '' : ' ';
    last.text += glue + run.text;
    last.runs.push(run);
    last.to = i;
    last.gapAfter = run.gapAfter;
  });
  return chunks;
}

function createVoice({ source = 'browser', ...options } = {}) {
  if (source === 'elevenlabs') {
    const engine = elevenEngine(options);
    if (engine.available) return engine;
  }
  return browserEngine(options);
}

/** The voices this device has installed, for the pickers in Settings. */
function deviceVoices() {
  try {
    return typeof speechSynthesis !== 'undefined' ? speechSynthesis.getVoices() || [] : [];
  } catch { return []; }
}

/** The voices on an ElevenLabs account, for the pickers in Settings. */
async function elevenVoices({ apiKey, endpoint = '' } = {}) {
  const url = endpoint ? `${endpoint}?voices=1` : 'https://api.elevenlabs.io/v1/voices';
  const res = await fetch(url, { headers: endpoint ? {} : { 'xi-api-key': apiKey } });
  if (!res.ok) {
    let detail = `${res.status} ${res.statusText}`;
    try {
      const problem = await res.json();
      detail = problem?.detail?.message || problem?.detail || detail;
    } catch { /* keep the status line */ }
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  const body = await res.json();
  return (body.voices || []).map((v) => ({
    id: v.voice_id,
    name: [v.name, v.labels?.accent, v.labels?.gender].filter(Boolean).join(' · '),
  }));
}


// ── src/diglot/ingest.js ──────────────────────────────────────
// Getting text in: from a URL, a pasted blob, a .txt file, or an EPUB.
// Everything runs in the browser — there's no server to send your reading to.

/**
 * Text-extraction proxies, tried in order. Both are public, CORS-friendly
 * services; if one is down or rate-limited we fall through to the next.
 */
const FETCHERS = [
  {
    name: 'jina',
    url: (u) => 'https://r.jina.ai/' + u,
    parse: (body) => fromMarkdown(body),
  },
  {
    name: 'allorigins',
    url: (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    parse: (body) => fromHtml(body),
  },
];

/**
 * Give up on a slow reader service rather than hanging. A dead link in a list
 * of twenty should cost you a few seconds, not the whole queue.
 */
function withTimeout(signal, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(new DOMException('Timeout', 'TimeoutError')), ms);
  const onAbort = () => controller.abort(signal.reason);
  if (signal) {
    if (signal.aborted) onAbort();
    else signal.addEventListener('abort', onAbort, { once: true });
  }
  return {
    signal: controller.signal,
    done: () => {
      clearTimeout(timer);
      signal?.removeEventListener('abort', onAbort);
    },
  };
}

/** Fetch a URL and pull the article text out of it. */
async function fetchArticle(url, { signal, timeout = 20000 } = {}) {
  const clean = /^https?:\/\//i.test(url) ? url : 'https://' + url;
  const errors = [];
  for (const fetcher of FETCHERS) {
    const guard = withTimeout(signal, timeout);
    try {
      const res = await fetch(fetcher.url(clean), {
        signal: guard.signal, headers: { Accept: 'text/plain, text/html' },
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const body = await res.text();
      const article = fetcher.parse(body);
      if (article.text.split(/\s+/).length > 120) return { ...article, url: clean, via: fetcher.name };
      errors.push(`${fetcher.name}: too little text`);
    } catch (err) {
      if (signal?.aborted) throw err;                       // the caller cancelled
      const why = err.name === 'TimeoutError' || err.name === 'AbortError'
        ? `no answer in ${Math.round(timeout / 1000)}s` : err.message;
      errors.push(`${fetcher.name}: ${why}`);
    } finally {
      guard.done();
    }
  }
  throw new Error(`Could not read that page (${errors.join('; ')})`);
}

/** r.jina.ai hands back markdown with a small header block. */
function fromMarkdown(body) {
  let title = '';
  let text = body;
  const header = body.match(/^Title:\s*(.+)$/m);
  if (header) title = header[1].trim();
  const marker = body.indexOf('Markdown Content:');
  if (marker !== -1) text = body.slice(marker + 'Markdown Content:'.length);

  text = text
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')            // images
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')          // links → their text
    .replace(/^\s*(={3,}|-{3,}|\*{3,})\s*$/gm, '')    // rules
    .replace(/^#{1,6}\s*/gm, '')                      // heading marks
    .replace(/[*_`>]/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  return { title, text };
}

/** A crude but effective readability pass: keep the densest block of prose. */
function fromHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const title = doc.querySelector('meta[property="og:title"]')?.content
    || doc.querySelector('title')?.textContent?.trim() || '';
  doc.querySelectorAll('script, style, nav, header, footer, aside, noscript, form, iframe, figure, figcaption').forEach((n) => n.remove());

  const candidates = [...doc.querySelectorAll('article, main, [role="main"], .post, .article-body, .entry-content, #content, body')];
  let best = null;
  let bestScore = 0;
  for (const el of candidates) {
    const paragraphs = el.querySelectorAll('p');
    let score = 0;
    paragraphs.forEach((p) => {
      const len = (p.textContent || '').trim().length;
      if (len > 80) score += len;
    });
    if (score > bestScore) { bestScore = score; best = el; }
  }
  const root = best || doc.body;
  const text = [...root.querySelectorAll('p, h2, h3, li, blockquote')]
    .map((p) => (p.textContent || '').replace(/\s+/g, ' ').trim())
    .filter((t) => t.length > 40)
    .join('\n\n');
  return { title, text: text || (root.textContent || '').replace(/\n{3,}/g, '\n\n').trim() };
}

/** Tidy pasted text: unwrap hard-wrapped lines, normalise blank lines. */
function cleanText(raw) {
  const text = raw.replace(/\r\n?/g, '\n').replace(/ /g, ' ');
  const hardWrapped = /\n(?!\n)/.test(text)
    && text.split('\n').filter((l) => l.trim()).slice(0, 40).filter((l) => l.length < 90).length > 20;
  const unwrapped = hardWrapped
    ? text.replace(/([^\n.!?"'”’:])\n(?=[a-z(“"'])/g, '$1 ')
    : text;
  return unwrapped.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

/** Break a long text into reader-sized sections at paragraph boundaries. */
function splitIntoSections(text, targetWords = 900) {
  const paragraphs = text.split(/\n{2,}/);
  const sections = [];
  let buffer = [];
  let count = 0;
  for (const paragraph of paragraphs) {
    const words = paragraph.split(/\s+/).filter(Boolean).length;
    if (count && count + words > targetWords) {
      sections.push(buffer.join('\n\n'));
      buffer = [];
      count = 0;
    }
    buffer.push(paragraph);
    count += words;
  }
  if (buffer.length) sections.push(buffer.join('\n\n'));
  return sections.length ? sections : [text];
}

const wordCount = (text) => (text.match(/[\p{L}\p{M}'’-]+/gu) || []).length;

/** Guess a title from the first line if we weren't given one. */
function guessTitle(text, fallback = 'Untitled') {
  const first = text.split('\n').map((l) => l.trim()).find(Boolean);
  if (!first) return fallback;
  const clipped = first.length > 70 ? first.slice(0, 67).replace(/\s+\S*$/, '') + '…' : first;
  return clipped.replace(/^#+\s*/, '') || fallback;
}


// ── src/diglot/epub.js ────────────────────────────────────────
// EPUB in and out, with no dependencies.
//
// Reading uses the browser/Node DecompressionStream for deflated entries;
// writing stores everything uncompressed, which is a perfectly legal ZIP and
// keeps the writer to a CRC table and a few headers. Good enough for books of
// the size a person actually reads.

// ── CRC32 ───────────────────────────────────────────────────────────────────

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// ── reading ─────────────────────────────────────────────────────────────────

/** Read a ZIP into a Map of path → Uint8Array. */
async function unzip(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  // Find the end-of-central-directory record (it has a variable-length comment).
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 65558; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a ZIP file (no end-of-central-directory record)');

  const count = view.getUint16(eocd + 10, true);
  let offset = view.getUint32(eocd + 16, true);
  const files = new Map();

  for (let n = 0; n < count; n++) {
    if (view.getUint32(offset, true) !== 0x02014b50) break;
    const method = view.getUint16(offset + 10, true);
    const compressedSize = view.getUint32(offset + 20, true);
    const nameLen = view.getUint16(offset + 28, true);
    const extraLen = view.getUint16(offset + 30, true);
    const commentLen = view.getUint16(offset + 32, true);
    const localOffset = view.getUint32(offset + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
    offset += 46 + nameLen + extraLen + commentLen;

    // The local header repeats the name and has its own extra field length.
    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const raw = bytes.subarray(dataStart, dataStart + compressedSize);
    if (name.endsWith('/')) continue;
    files.set(name, method === 0 ? raw : await inflate(raw));
  }
  return files;
}

async function inflate(raw) {
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unzip compressed EPUBs');
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

const decode = (bytes) => new TextDecoder('utf-8').decode(bytes);

/**
 * Pull a readable book out of an EPUB: title, author, and chapters of text.
 * Falls back to document order if the spine can't be read.
 */
async function readEpub(buffer) {
  const files = await unzip(buffer);
  const parser = new DOMParser();

  const containerFile = files.get('META-INF/container.xml');
  let opfPath = null;
  if (containerFile) {
    const container = parser.parseFromString(decode(containerFile), 'application/xml');
    opfPath = container.querySelector('rootfile')?.getAttribute('full-path') || null;
  }
  if (!opfPath) opfPath = [...files.keys()].find((k) => k.endsWith('.opf'));
  if (!opfPath) throw new Error('No OPF package file — is this really an EPUB?');

  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const opf = parser.parseFromString(decode(files.get(opfPath)), 'application/xml');
  const title = opf.querySelector('metadata > *|title, title')?.textContent?.trim() || 'Untitled';
  const author = opf.querySelector('metadata > *|creator, creator')?.textContent?.trim() || '';

  const manifest = new Map();
  opf.querySelectorAll('manifest > item').forEach((item) => {
    manifest.set(item.getAttribute('id'), {
      href: item.getAttribute('href'),
      type: item.getAttribute('media-type'),
    });
  });
  const spine = [...opf.querySelectorAll('spine > itemref')]
    .map((ref) => manifest.get(ref.getAttribute('idref')))
    .filter((item) => item && /xhtml|html/.test(item.type || ''));
  const docs = spine.length ? spine.map((s) => resolve(base, s.href))
    : [...files.keys()].filter((k) => /\.x?html?$/i.test(k)).sort();

  const chapters = [];
  for (const path of docs) {
    const file = files.get(path) || files.get(decodeURIComponent(path));
    if (!file) continue;
    const doc = parser.parseFromString(decode(file), 'text/html');
    const heading = doc.querySelector('h1, h2, h3, title')?.textContent?.trim() || '';
    const text = htmlToText(doc.body || doc.documentElement);
    if (text.split(/\s+/).length < 20) continue; // covers, blank pages
    chapters.push({ title: heading || `Part ${chapters.length + 1}`, text });
  }
  if (!chapters.length) throw new Error('No readable chapters found in this EPUB');
  return { title, author, chapters };
}

function resolve(base, href) {
  const path = base + href;
  const parts = [];
  for (const part of path.split('/')) {
    if (part === '.' || part === '') continue;
    if (part === '..') parts.pop();
    else parts.push(part);
  }
  return parts.join('/');
}

/** Flatten a DOM subtree to text with blank lines between blocks. */
function htmlToText(root) {
  if (!root) return '';
  const clone = root.cloneNode(true);
  clone.querySelectorAll('script, style, nav, header, footer, aside, noscript, svg, form, iframe').forEach((n) => n.remove());
  const BLOCK = 'p, div, section, article, h1, h2, h3, h4, h5, h6, li, blockquote, tr, pre, br';
  clone.querySelectorAll(BLOCK).forEach((el) => {
    el.append(document.createTextNode('\n\n'));
  });
  return (clone.textContent || '')
    .replace(/ /g, ' ')
    .replace(/[ \t]+/g, ' ')
    .replace(/ ?\n ?/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// ── writing ─────────────────────────────────────────────────────────────────

const utf8 = (s) => new TextEncoder().encode(s);

/** Build a ZIP (all entries stored) from [{ name, data }]. */
function zip(entries) {
  const chunks = [];
  const central = [];
  let offset = 0;

  for (const entry of entries) {
    const nameBytes = utf8(entry.name);
    const data = typeof entry.data === 'string' ? utf8(entry.data) : entry.data;
    const crc = crc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);       // version needed
    lv.setUint16(6, 0x0800, true);   // UTF-8 names
    lv.setUint16(8, 0, true);        // stored
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);

    const dir = new Uint8Array(46 + nameBytes.length);
    const dv = new DataView(dir.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 20, true);
    dv.setUint16(8, 0x0800, true);
    dv.setUint16(10, 0, true);
    dv.setUint32(16, crc, true);
    dv.setUint32(20, data.length, true);
    dv.setUint32(24, data.length, true);
    dv.setUint16(28, nameBytes.length, true);
    dv.setUint32(42, offset, true);
    dir.set(nameBytes, 46);
    central.push(dir);

    offset += local.length + data.length;
  }

  const centralSize = central.reduce((n, c) => n + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);

  const total = offset + centralSize + 22;
  const out = new Uint8Array(total);
  let p = 0;
  for (const c of [...chunks, ...central, end]) { out.set(c, p); p += c.length; }
  return out;
}

const escapeXml = (s = '') => s.replace(/[<>&"']/g, (c) => (
  { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));

const EPUB_CSS = `
body { font-family: Georgia, serif; line-height: 1.6; margin: 1em; }
h1, h2 { font-family: Helvetica, Arial, sans-serif; line-height: 1.25; }
p { margin: 0 0 0.9em; text-indent: 0; }
.es { font-weight: 600; }
.gloss { font-size: 0.75em; color: #666; font-weight: normal; }
.vocab { font-size: 0.95em; }
.vocab dt { font-weight: 600; margin-top: 0.6em; }
.vocab dd { margin: 0 0 0 1.2em; color: #555; }
.note { color: #555; font-style: italic; }
`;

/**
 * Build a Send-to-Kindle-ready EPUB.
 * chapters: [{ title, html }]  vocab: [{ es, en }]
 */
function buildEpub({ title, author = 'Diglot', chapters, vocab = [], level = 0, language = 'es' }) {
  const id = 'diglot-' + Date.now();
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const files = [];

  const page = (heading, body) => `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head><meta charset="utf-8"/><title>${escapeXml(heading)}</title>
<link rel="stylesheet" type="text/css" href="style.css"/></head>
<body><h1>${escapeXml(heading)}</h1>
${body}
</body></html>`;

  chapters.forEach((ch, i) => {
    files.push({ name: `OEBPS/ch${i + 1}.xhtml`, data: page(ch.title || `Chapter ${i + 1}`, ch.html) });
  });

  if (vocab.length) {
    const list = vocab.map((v) => `<dt>${escapeXml(v.es)}</dt><dd>${escapeXml(v.en)}</dd>`).join('\n');
    files.push({
      name: 'OEBPS/vocab.xhtml',
      data: page('Vocabulary', `<p class="note">Every Spanish word woven into this text, in the order you met it.</p>\n<dl class="vocab">${list}</dl>`),
    });
  }

  const chapterItems = chapters.map((_, i) => `ch${i + 1}`).concat(vocab.length ? ['vocab'] : []);
  const manifest = chapterItems
    .map((cid) => `<item id="${cid}" href="${cid}.xhtml" media-type="application/xhtml+xml"/>`).join('\n    ');
  const spine = chapterItems.map((cid) => `<itemref idref="${cid}"/>`).join('\n    ');
  const navItems = chapters.map((ch, i) => `<li><a href="ch${i + 1}.xhtml">${escapeXml(ch.title || `Chapter ${i + 1}`)}</a></li>`)
    .concat(vocab.length ? ['<li><a href="vocab.xhtml">Vocabulary</a></li>'] : []).join('\n      ');

  files.push({
    name: 'OEBPS/nav.xhtml',
    data: `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="en" xml:lang="en">
<head><meta charset="utf-8"/><title>Contents</title></head>
<body><nav epub:type="toc" id="toc"><h1>Contents</h1><ol>
      ${navItems}
</ol></nav></body></html>`,
  });

  files.push({
    name: 'OEBPS/content.opf',
    data: `<?xml version="1.0" encoding="utf-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="bookid">${id}</dc:identifier>
    <dc:title>${escapeXml(title)}</dc:title>
    <dc:creator>${escapeXml(author)}</dc:creator>
    <dc:language>en</dc:language>
    <dc:description>Diglot weave at ${level}% ${escapeXml(language)}.</dc:description>
    <meta property="dcterms:modified">${now}</meta>
  </metadata>
  <manifest>
    <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
    <item id="css" href="style.css" media-type="text/css"/>
    ${manifest}
  </manifest>
  <spine>
    ${spine}
  </spine>
</package>`,
  });

  files.push({ name: 'OEBPS/style.css', data: EPUB_CSS });
  files.push({
    name: 'META-INF/container.xml',
    data: `<?xml version="1.0" encoding="utf-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
</container>`,
  });

  // The mimetype entry must come first and be stored uncompressed.
  return zip([{ name: 'mimetype', data: 'application/epub+zip' }, ...files]);
}


// ── src/diglot/llm.js ─────────────────────────────────────────
// Optional Claude layer. Everything here needs the user's own API key, kept in
// their browser and sent only to api.anthropic.com.
//
// The key idea: Claude does NOT write the woven text. It returns an alignment —
// the Spanish for each notable word *in this context*, with a difficulty tier.
// We merge that into the lexicon, so the slider stays instant and local, and
// re-reading at a different level costs nothing.

const API = 'https://api.anthropic.com/v1/messages';

const MODELS = [
  { id: 'claude-sonnet-5', label: 'Sonnet 5 — balanced (recommended)' },
  { id: 'claude-opus-5', label: 'Opus 5 — best quality, slower' },
  { id: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5 — fastest, cheapest' },
];

async function callClaude({ apiKey, model, system, messages, maxTokens = 8000, signal }) {
  const res = await fetch(API, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model, max_tokens: maxTokens, system, messages }),
    signal,
  });
  if (!res.ok) {
    let detail = `${res.status} ${res.statusText}`;
    try {
      const body = await res.json();
      if (body?.error?.message) detail = body.error.message;
    } catch { /* keep the status line */ }
    throw new Error(detail);
  }
  const body = await res.json();
  return (body.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('');
}

function extractJson(text) {
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const candidate = fenced ? fenced[1] : text;
  const start = candidate.search(/[[{]/);
  if (start === -1) throw new Error('No JSON in the model reply');
  const end = Math.max(candidate.lastIndexOf(']'), candidate.lastIndexOf('}'));
  return JSON.parse(candidate.slice(start, end + 1));
}

const ALIGN_SYSTEM = `You build vocabulary tables for a diglot-weave Spanish reader.

Given an English passage, list the words and short phrases worth teaching, with
the Spanish that fits THIS context. Rules:

- Give the dictionary form of the English word (singular noun, bare infinitive
  verb, positive adjective) and the matching Spanish dictionary form. The reader
  inflects them itself.
- pos is one of: n, v, adj, adv, prep, conj, pron, num, phrase.
- For nouns give grammatical gender "m" or "f". Otherwise omit gender.
- tier is 1–10: how hard the Spanish word is for an English speaker learning
  Spanish. 1 = a beginner's first hundred words or an obvious cognate,
  10 = advanced or literary.
- Prefer neutral peninsular Spanish. No regionalisms unless the text demands it.
- Skip proper nouns, numerals written as digits, and words whose Spanish would
  be identical to the English.
- Include multi-word phrases where a word-for-word swap would be wrong
  (idioms, phrasal verbs, fixed expressions).
- Cover the passage thoroughly: aim for every content word.

Reply with JSON only: [{"en":"...","es":"...","pos":"n","gender":"f","tier":3}]`;

/**
 * Ask Claude for a context-accurate vocabulary alignment of a passage.
 * Returns lexicon entries ready to merge, in this app's "en|es|pos|extra" shape.
 */
async function alignPassage(text, { apiKey, model = MODELS[0].id, signal } = {}) {
  const reply = await callClaude({
    apiKey, model, signal,
    system: ALIGN_SYSTEM,
    messages: [{ role: 'user', content: `Passage:\n\n${text}` }],
  });
  const rows = extractJson(reply);
  const entries = [];
  for (const row of Array.isArray(rows) ? rows : []) {
    if (!row || typeof row.en !== 'string' || typeof row.es !== 'string') continue;
    const en = row.en.trim().toLowerCase();
    const es = row.es.trim();
    if (!en || !es || en === es.toLowerCase()) continue;
    const pos = /^(n|v|adj|adv|prep|conj|pron|num|phrase)$/.test(row.pos) ? row.pos : 'n';
    const tier = Math.min(10, Math.max(1, Math.round(Number(row.tier) || 5)));
    entries.push({ en, es, pos, gender: row.gender === 'f' ? 'f' : 'm', tier });
  }
  return entries;
}

/** Align a long document a chunk at a time, reporting progress as it goes. */
async function alignDocument(text, { apiKey, model, chunkWords = 700, onProgress, signal } = {}) {
  const paragraphs = text.split(/\n{2,}/);
  const chunks = [];
  let buffer = [];
  let count = 0;
  for (const paragraph of paragraphs) {
    const words = paragraph.split(/\s+/).filter(Boolean).length;
    if (count && count + words > chunkWords) { chunks.push(buffer.join('\n\n')); buffer = []; count = 0; }
    buffer.push(paragraph);
    count += words;
  }
  if (buffer.length) chunks.push(buffer.join('\n\n'));

  const merged = new Map();
  for (const [i, chunk] of chunks.entries()) {
    onProgress?.({ done: i, total: chunks.length });
    const entries = await alignPassage(chunk, { apiKey, model, signal });
    for (const entry of entries) if (!merged.has(entry.en)) merged.set(entry.en, entry);
  }
  onProgress?.({ done: chunks.length, total: chunks.length });
  return [...merged.values()];
}

const WRITE_SYSTEM = `You write original short articles for language learners to read.

- Write in clear, natural English — the reader will see it woven with Spanish.
- Concrete and specific: real detail, no filler, no throat-clearing intro.
- Short paragraphs. No headings, no bullet lists, no markdown.
- Never reproduce copyrighted text; write something original.
- Start with a one-line title on its own, then a blank line, then the article.`;

/** Generate an original article on a topic, to weave. */
async function writeArticle(topic, { apiKey, model = MODELS[0].id, words = 400, signal } = {}) {
  const reply = await callClaude({
    apiKey, model, signal, maxTokens: 4000,
    system: WRITE_SYSTEM,
    messages: [{ role: 'user', content: `Write an article of about ${words} words about: ${topic}` }],
  });
  const lines = reply.trim().split('\n');
  const title = lines[0].replace(/^#+\s*/, '').trim();
  return { title, text: lines.slice(1).join('\n').trim() || reply.trim() };
}

const DIALOGUE_SYSTEM = `You write short everyday dialogues for someone learning Spanish.

Write the dialogue in ENGLISH — the reader's app weaves the Spanish in itself.

Format, exactly:
- A one-line title, then a blank line.
- Then the dialogue: one turn per line, "Speaker: what they say", with a blank
  line between turns. Name the speakers by their role ("Waiter", "You",
  "Pharmacist"). Two speakers, occasionally three.
- 8 to 14 turns. Real spoken English, short sentences, no narration or stage
  directions. Include the awkward bits: not understanding, asking someone to
  repeat, getting the price wrong.
- Then a blank line, then a line reading exactly: PHRASES
- Then 6 to 8 lines, each "English sentence = Spanish sentence", taking the most
  useful things said in the dialogue. Neutral peninsular Spanish, written the
  way a person actually says it, with correct punctuation (¿ ¡ and accents).

Nothing else — no headings, no markdown, no commentary.`;

/** Generate an everyday dialogue, with its key phrases in real Spanish. */
async function writeScene(situation, { apiKey, model = MODELS[0].id, signal } = {}) {
  const reply = await callClaude({
    apiKey, model, signal, maxTokens: 3000,
    system: DIALOGUE_SYSTEM,
    messages: [{ role: 'user', content: `Write a dialogue for this situation: ${situation}` }],
  });
  const [head, phraseBlock = ''] = reply.trim().split(/^\s*PHRASES\s*$/m);
  const lines = head.trim().split('\n');
  const title = lines[0].replace(/^#+\s*/, '').trim();
  const text = lines.slice(1).join('\n').trim();
  const phrases = phraseBlock.trim().split('\n')
    .map((line) => line.replace(/^[-*\d.\s]+/, '').split('='))
    .filter((parts) => parts.length >= 2)
    .map(([en, ...rest]) => ({ en: en.trim(), es: rest.join('=').trim() }))
    .filter((p) => p.en && p.es);
  return { title, text, phrases };
}

/** Cheap key check: one token, so it costs essentially nothing. */
async function testKey({ apiKey, model = MODELS[0].id }) {
  await callClaude({ apiKey, model, maxTokens: 1, system: 'Reply with "ok".', messages: [{ role: 'user', content: 'ok' }] });
  return true;
}

/** Turn Claude's entries into extra bands the weaver can index. */
function entriesToBands(entries) {
  const bands = Array.from({ length: 10 }, () => []);
  for (const e of entries) {
    const extra = e.pos === 'n' ? `|${e.gender}` : '';
    bands[e.tier - 1].push(`${e.en}|${e.es}|${e.pos}${extra}`);
  }
  return bands;
}

  catch { return { ...fallback }; }

const prefs = load(PREF_KEY, defaultPrefs);
const vocabRaw = load(VOCAB_KEY, { known: [], blocked: [], met: {} });

// Documents can be whole books, so they live in IndexedDB rather than localStorage.
const db = {
  open() {
    if (this._p) return this._p;
    this._p = new Promise((resolve, reject) => {
      const req = indexedDB.open('diglot', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('docs', { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return this._p;
  },
  async tx(mode, fn) {
    const database = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = database.transaction('docs', mode);
      const request = fn(transaction.objectStore('docs'));
      transaction.oncomplete = () => resolve(request?.result);
      transaction.onerror = () => reject(transaction.error);
    });
  },
  put(doc) { return this.tx('readwrite', (store) => store.put(doc)); },
  get(id) { return this.tx('readonly', (store) => store.get(id)); },
  all() { return this.tx('readonly', (store) => store.getAll()); },
  remove(id) { return this.tx('readwrite', (store) => store.delete(id)); },
};

// ── weaving ─────────────────────────────────────────────────────────────────

function rebuildIndex() {
  const extra = state.doc?.extra?.length ? entriesToBands(state.doc.extra) : null;
  if (!extra) { state.index = DEFAULT_INDEX; return; }
  // Merge Claude's entries into the standard bands, tier by tier, so a word it
  // rates "tier 3" appears at the same point on the dial as a band-2 staple.
  const merged = BANDS.map((band, i) => [...band, ...(extra[i] || [])]);
  for (let i = BANDS.length; i < extra.length; i++) merged.push(extra[i]);
  state.index = buildIndex(merged);
}

function currentText() {
  if (!state.doc) return '';
  return state.doc.sections[state.sectionIndex] || '';
}

function reanalyze() {
  const text = currentText();
  state.analysis = text ? analyze(text, state.index) : null;
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function narrationOptions() {
  return { ...NARRATION_DEFAULTS, echo: prefs.echo, wordGap: Number(prefs.wordGap) || 0 };
}

function render() {
  const reader = $('reader');
  reader.textContent = '';
  state.sentenceEls = [];
  state.partEls = new Map();
  $('btnDrill').hidden = !(state.doc?.phrases?.length);
  $('btnDrill').classList.toggle('on', state.mode === 'drill');
  if (state.mode === 'drill') { renderDrill(reader); return; }
  if (!state.analysis) {
    state.narration = null;
    reader.append(el('p', 'empty', 'Add some text to start reading — an article URL, a paste, a topic, or an EPUB.'));
    $('actualOut').textContent = '0';
    renderSectionNav();
    return;
  }

  const result = applyLevel(state.analysis, {
    level: prefs.level,
    articles: prefs.articles,
    firstHint: prefs.firstHint,
    known: vocab.known,
    blocked: vocab.blocked,
  });
  state.rendered = result;

  if (state.sectionIndex === 0) {
    reader.append(el('h1', 'title', state.doc.title));
    if (state.doc.author || state.doc.source) {
      reader.append(el('div', 'byline', [state.doc.author, state.doc.source].filter(Boolean).join(' · ')));
    }
  }

  // The narration decides where sentences and paragraphs begin, and the page is
  // drawn from that same structure — so the highlight always matches the voice.
  const narration = buildNarration(result.nodes, narrationOptions());
  state.narration = narration;
  state.speakers = [...new Set(narration.sentences.map((x) => x.speaker).filter(Boolean))];

  let paragraph = null;
  const closeParagraph = () => {
    if (paragraph && paragraph.hasChildNodes()) reader.append(paragraph);
    paragraph = null;
  };

  for (const sentence of narration.sentences) {
    if (sentence.paragraphStart || !paragraph) { closeParagraph(); paragraph = el('p'); }
    const sentenceEl = el('span', 'sentence');
    sentenceEl.dataset.s = String(sentence.index);

    sentence.parts.forEach((part, partIndex) => {
      if (part.type === 'speaker') {
        const slot = speakerSlot(part.speaker);
        sentenceEl.append(el('b', slot ? 'who b' : 'who', part.text.replace(/:$/, '')));
        return;
      }
      if (part.type === 'text') {
        sentenceEl.append(document.createTextNode(part.text));
        return;
      }
      const node = part.node;
      const span = el('span', vocab.known.has(node.key) ? 'es known' : 'es', node.text);
      span.dataset.en = node.en;
      span.dataset.key = node.key;
      span.dataset.rank = node.rank;
      span.dataset.pos = node.pos;
      span.dataset.s = String(sentence.index);
      if (node.hint) span.append(el('span', 'hint', ` (${node.hint})`));
      state.partEls.set(`${sentence.index}:${partIndex}`, span);
      sentenceEl.append(span);
    });

    state.sentenceEls[sentence.index] = sentenceEl;
    paragraph.append(sentenceEl);
    if (sentence.endsParagraph) closeParagraph();
  }
  closeParagraph();

  for (const node of result.nodes) {
    if (node.kind === 'swap' && node.first && node.pos !== 'det') {
      vocab.met[node.key] = (vocab.met[node.key] || 0) + 1;
    }
  }
  saveVocabThrottled();

  $('actualOut').textContent = Math.round(result.stats.ratio * 100);
  $('stageOut').textContent = stageName(prefs.level);
  renderSectionNav();
  onTextRerendered();
}

/** Which voice a speaker gets: first speaker one way, second the other. */
function speakerSlot(name) {
  if (!name) return 0;
  const at = state.speakers.indexOf(name);
  return at < 0 ? 0 : at % 2;
}

/** Listen-and-repeat: the English, a gap, then the Spanish. */
function renderDrill(reader) {
  const phrases = state.doc?.phrases || [];
  state.narration = { sentences: buildDrill(phrases, { gap: prefs.drillGap, repeat: prefs.drillRepeat }) };
  state.speakers = [];

  reader.append(el('h1', 'title', state.doc.title));
  reader.append(el('div', 'byline', `${phrases.length} phrases · say each one into the gap, then hear it`));

  const list = el('div', 'drill' + (prefs.drillCover ? ' cover' : ''));
  phrases.forEach((phrase, i) => {
    const row = el('div', 'row');
    row.append(el('span', 'en', phrase.en));
    row.append(el('span', 'es', phrase.es));
    row.onclick = () => {
      row.classList.add('shown');
      if (!player.active) speakOne(phrase.es);
      else listenFrom(i);
    };
    state.sentenceEls[i] = row;
    list.append(row);
  });
  reader.append(list);

  const options = el('div', 'section-nav');
  const cover = el('button', 'btn' + (prefs.drillCover ? ' on' : ''), prefs.drillCover ? 'Spanish hidden' : 'Spanish shown');
  cover.onclick = () => { prefs.drillCover = !prefs.drillCover; savePrefs(); render(); };
  const repeat = el('button', 'btn' + (prefs.drillRepeat ? ' on' : ''), prefs.drillRepeat ? 'Says it twice' : 'Says it once');
  repeat.onclick = () => { prefs.drillRepeat = !prefs.drillRepeat; savePrefs(); render(); };
  const gap = el('select');
  [['1600', 'Short gap'], ['2600', 'Normal gap'], ['4000', 'Long gap']].forEach(([v, label]) => {
    const o = el('option', null, label); o.value = v; gap.append(o);
  });
  gap.value = String(prefs.drillGap);
  gap.onchange = () => { prefs.drillGap = Number(gap.value); savePrefs(); render(); };
  options.append(cover, repeat, gap);
  reader.append(options);

  $('actualOut').textContent = '100';
  $('stageOut').textContent = 'phrase drill';
  onTextRerendered();
}

function stageName(level) {
  if (level === 0) return 'plain English';
  if (level < 15) return 'easing in';
  if (level < 35) return 'first hundred words';
  if (level < 55) return 'everyday vocabulary';
  if (level < 75) return 'reading properly';
  if (level < 95) return 'mostly Spanish';
  return 'English glue only';
}

let vocabTimer = null;
function saveVocabThrottled() {
  clearTimeout(vocabTimer);
  vocabTimer = setTimeout(saveVocab, 800);
}

function renderSectionNav() {
  const nav = $('sectionNav');
  nav.textContent = '';
  if (state.mode === 'drill') return;
  if (!state.doc || state.doc.sections.length < 2) return;
  const prev = el('button', 'btn', '← Previous');
  const next = el('button', 'btn', 'Next →');
  const label = el('div', 'readout', `Part ${state.sectionIndex + 1} of ${state.doc.sections.length}`);
  prev.disabled = state.sectionIndex === 0;
  next.disabled = state.sectionIndex >= state.doc.sections.length - 1;
  prev.onclick = () => gotoSection(state.sectionIndex - 1);
  next.onclick = () => gotoSection(state.sectionIndex + 1);
  nav.append(prev, label, next);
}

function gotoSection(i, { keepPlaying = false } = {}) {
  const wasPlaying = keepPlaying && player.active;
  if (!keepPlaying) stopListening();
  state.sectionIndex = Math.max(0, Math.min(i, state.doc.sections.length - 1));
  state.doc.position = state.sectionIndex;
  db.put(state.doc).catch(() => {});
  reanalyze();
  if (wasPlaying) { player.sentence = 0; player.run = 0; }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── loading documents ───────────────────────────────────────────────────────

async function loadDoc(doc, { persist = true } = {}) {
  stopListening();
  if (!doc.phrases?.length) state.mode = 'read';
  state.doc = doc;
  state.sectionIndex = Math.min(doc.position || 0, doc.sections.length - 1);
  rebuildIndex();
  reanalyze();
  $('docTitle').textContent = `${doc.title}${doc.sections.length > 1 ? ` · ${doc.sections.length} parts` : ''}`;
  prefs.lastDoc = doc.id;
  savePrefs();
  if (persist) await db.put(doc).catch(() => {});
  render();
  updateEnrichButton();
  window.scrollTo({ top: 0 });
}

function makeDoc({ title, author = '', source = '', text }) {
  const clean = cleanText(text);
  return {
    id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title: title || guessTitle(clean),
    author, source,
    sections: splitIntoSections(clean, 900),
    words: wordCount(clean),
    added: Date.now(),
    position: 0,
    extra: [],
  };
}

// ── panels ──────────────────────────────────────────────────────────────────

function openPanel(title, build) {
  $('panelTitle').textContent = title;
  const body = $('panelBody');
  body.textContent = '';
  build(body);
  $('panel').classList.add('open');
  $('scrim').classList.add('open');
}
function closePanel() {
  $('panel').classList.remove('open');
  $('scrim').classList.remove('open');
  refreshAudioEstimate = null;
}

function field(label, control, help) {
  const wrap = el('div', 'field');
  if (label) wrap.append(el('label', null, label));
  wrap.append(control);
  if (help) wrap.append(el('div', 'help', help));
  return wrap;
}

function checkbox(label, checked, onChange, help) {
  const wrap = el('label', 'check');
  const input = el('input');
  input.type = 'checkbox';
  input.checked = checked;
  input.onchange = () => onChange(input.checked);
  const text = el('span', null, label);
  if (help) text.append(el('small', null, help));
  wrap.append(input, text);
  return wrap;
}

// ── add text ────────────────────────────────────────────────────────────────

function panelAdd(initialTab = 'paste') {
  openPanel('Add something to read', (body) => {
    const tabs = el('div', 'tabs');
    const pane = el('div');
    const status = el('div', 'status');
    const options = [
      ['paste', 'Paste'], ['url', 'Web page'], ['queue', 'A list of them'],
      ['topic', 'Write me one'], ['file', 'Book / file'],
    ];
    let active = initialTab;
    const draw = () => {
      tabs.textContent = '';
      options.forEach(([id, label]) => {
        const tab = el('button', 'tab' + (id === active ? ' on' : ''), label);
        tab.onclick = () => { active = id; draw(); };
        tabs.append(tab);
      });
      pane.textContent = '';
      status.textContent = '';
      status.className = 'status';
      ({ paste: paneP, url: paneU, queue: paneQ, topic: paneT, file: paneF })[active](pane, status);
    };

    const paneP = (host) => {
      const box = el('textarea');
      box.placeholder = 'Paste an article, an email, your own writing — anything in English.';
      const title = el('input');
      title.type = 'text';
      title.placeholder = 'Title (optional)';
      const go = el('button', 'btn primary', 'Read it');
      go.onclick = async () => {
        if (!box.value.trim()) { fail(status, 'Nothing pasted yet.'); return; }
        await loadDoc(makeDoc({ title: title.value.trim(), text: box.value }));
        closePanel();
      };
      host.append(field(null, box), field(null, title), go);
    };

    const paneU = (host) => {
      const input = el('input');
      input.type = 'url';
      input.placeholder = 'https://example.com/an-article';
      const go = el('button', 'btn primary', 'Fetch and weave');
      go.onclick = async () => {
        const url = input.value.trim();
        if (!url) { fail(status, 'Paste a link first.'); return; }
        busy(status, 'Fetching the page…');
        try {
          const article = await fetchArticle(url);
          const doc = makeDoc({
            title: article.title, text: article.text,
            source: new URL(article.url).hostname.replace(/^www\./, ''),
          });
          await loadDoc(doc);
          closePanel();
        } catch (err) { fail(status, err.message); }
      };
      host.append(
        field('Article URL', input, 'The page is fetched through a public reader service (r.jina.ai, then allorigins) because a browser cannot read another site directly. Paywalled pages usually will not work — paste the text instead.'),
        go, status,
      );
    };

    const paneQ = (host, status) => {
      const box = el('textarea');
      box.placeholder = 'One per line. A link is fetched; anything else is a topic Claude writes about.\n\nhttps://example.com/an-article\nhow sourdough works\nthe history of Wexford harbour';
      const combined = { value: false };
      const results = el('div');
      const go = el('button', 'btn primary', 'Add them all');

      go.onclick = async () => {
        const lines = box.value.split('\n').map((l) => l.trim()).filter(Boolean);
        if (!lines.length) { fail(status, 'Nothing in the list yet.'); return; }
        results.textContent = '';
        const collected = [];
        let firstDoc = null;
        for (const [i, line] of lines.entries()) {
          busy(status, `${i + 1} of ${lines.length}: ${line.slice(0, 50)}…`);
          const row = el('div', 'card');
          const grow = el('div', 'grow');
          grow.append(el('h3', null, line.length > 60 ? line.slice(0, 57) + '…' : line));
          const note = el('div', 'sub', 'working…');
          grow.append(note);
          row.append(grow);
          results.append(row);
          try {
            const item = isLink(line)
              ? await fetchArticle(line).then((a) => ({
                title: a.title, text: a.text, source: new URL(a.url).hostname.replace(/^www\./, ''),
              }))
              : await writeFromTopic(line);
            if (!item.text || item.text.split(/\s+/).length < 40) throw new Error('too little text came back');
            note.textContent = `${item.title || 'Untitled'} · ${wordCount(item.text)} words`;
            if (combined.value) collected.push(item);
            else {
              const doc = makeDoc(item);
              await db.put(doc);
              if (!firstDoc) firstDoc = doc;
            }
          } catch (err) {
            note.textContent = err.message;
            row.style.opacity = '.7';
          }
        }

        if (combined.value && collected.length) {
          const text = collected.map((item) => `${item.title}\n\n${item.text}`).join('\n\n');
          firstDoc = makeDoc({ title: `Reading list — ${new Date().toLocaleDateString()}`, text, source: `${collected.length} pieces` });
          await db.put(firstDoc);
        }
        if (firstDoc) {
          done(status, 'Done. Opening the first one — the rest are in your library.');
          await loadDoc(firstDoc, { persist: false });
        } else fail(status, 'None of them worked.');
      };

      host.append(
        field('Links and topics', box, 'Links are fetched through the same reader service as a single page. Topics need an Anthropic API key.'),
        checkbox('Join them into one document', false, (v) => { combined.value = v; },
          'Otherwise each one becomes its own piece in the library.'),
        go, results,
      );
    };

    const paneT = (host) => {
      const input = el('input');
      input.type = 'text';
      input.placeholder = 'e.g. how sourdough works, or the history of Wexford harbour';
      const form = el('select');
      [['article', 'An article to read'], ['dialogue', 'A dialogue, with its key phrases']]
        .forEach(([v, l]) => { const o = el('option', null, l); o.value = v; form.append(o); });
      const length = el('select');
      [['250', 'Short — 250 words'], ['400', 'Medium — 400 words'], ['700', 'Long — 700 words']]
        .forEach(([v, l]) => { const o = el('option', null, l); o.value = v; length.append(o); });
      length.value = '400';
      form.onchange = () => { length.disabled = form.value === 'dialogue'; };
      const go = el('button', 'btn primary', 'Write it');
      go.onclick = async () => {
        if (!prefs.apiKey) { fail(status, 'This one needs an Anthropic API key — add it in Settings.'); return; }
        const topic = input.value.trim();
        if (!topic) { fail(status, 'What should it be about?'); return; }
        busy(status, 'Writing…');
        try {
          const item = await writeFromTopic(topic, {
            form: form.value, words: Number(length.value),
          });
          const doc = makeDoc(item);
          if (item.phrases?.length) { doc.kind = 'scene'; doc.phrases = item.phrases; }
          await loadDoc(doc);
          busy(status, 'Aligning the vocabulary…');
          await enrich(doc, status);
          closePanel();
        } catch (err) { fail(status, err.message); }
      };
      host.append(
        field('Topic or situation', input, prefs.apiKey ? 'Claude writes it, then aligns its vocabulary so the whole thing can go Spanish. A dialogue also comes back with its key phrases in full Spanish, ready to drill.' : 'Needs an Anthropic API key (Settings).'),
        field('What to write', form), field('Length', length), go, status,
      );
    };

    const paneF = (host) => {
      const input = el('input');
      input.type = 'file';
      input.accept = '.epub,.txt,.md,.html';
      const go = el('button', 'btn primary', 'Load');
      go.onclick = async () => {
        const file = input.files?.[0];
        if (!file) { fail(status, 'Choose a file first.'); return; }
        busy(status, `Reading ${file.name}…`);
        try {
          if (/\.epub$/i.test(file.name)) {
            const book = await readEpub(await file.arrayBuffer());
            const doc = makeDoc({ title: book.title, author: book.author, text: book.chapters[0].text, source: 'EPUB' });
            doc.sections = book.chapters.flatMap((ch) => splitIntoSections(cleanText(ch.text), 900));
            doc.words = doc.sections.reduce((n, s) => n + wordCount(s), 0);
            await loadDoc(doc);
          } else {
            const text = await file.text();
            const body = /\.html?$/i.test(file.name)
              ? new DOMParser().parseFromString(text, 'text/html').body.textContent
              : text;
            await loadDoc(makeDoc({ title: file.name.replace(/\.[^.]+$/, ''), text: body, source: 'file' }));
          }
          closePanel();
        } catch (err) { fail(status, err.message); }
      };
      host.append(
        field('EPUB, .txt, .md or .html', input, 'The file never leaves your browser. DRM-free EPUBs only — a Kindle .azw will not open. Project Gutenberg is a good source of free books.'),
        go, status,
      );
    };

    body.append(tabs, pane, status);
    draw();
  });
}

const isLink = (line) => /^(https?:\/\/|www\.)/i.test(line) || /^[\w-]+(\.[\w-]+)+\/\S/.test(line);

/** One topic → a written piece. Used by the topic tab and the bulk queue. */
async function writeFromTopic(topic, { form = 'article', words = 400 } = {}) {
  if (!prefs.apiKey) throw new Error('needs an Anthropic API key (Settings)');
  if (form === 'dialogue') {
    const scene = await writeScene(topic, { apiKey: prefs.apiKey, model: prefs.model });
    return { title: scene.title, text: scene.text, phrases: scene.phrases, source: 'dialogue written for you' };
  }
  const article = await writeArticle(topic, { apiKey: prefs.apiKey, model: prefs.model, words });
  return { title: article.title, text: article.text, source: 'written for you' };
}

const busy = (node, message) => {
  node.className = 'status';
  node.textContent = '';
  node.append(el('span', 'spinner'), document.createTextNode(message));
};
const fail = (node, message) => { node.className = 'status error'; node.textContent = message; };
const done = (node, message) => { node.className = 'status'; node.textContent = message; };

// ── Claude enrichment ───────────────────────────────────────────────────────

async function enrich(doc, status) {
  if (!prefs.apiKey) throw new Error('Add an Anthropic API key in Settings first.');
  const text = doc.sections.join('\n\n');
  const entries = await alignDocument(text, {
    apiKey: prefs.apiKey,
    model: prefs.model,
    onProgress: ({ done: d, total }) => status && busy(status, `Aligning vocabulary… part ${Math.min(d + 1, total)} of ${total}`),
  });
  doc.extra = entries;
  await db.put(doc).catch(() => {});
  if (state.doc?.id === doc.id) {
    rebuildIndex();
    reanalyze();
    render();
  }
  updateEnrichButton();
  status && done(status, `Added ${entries.length} words from this text.`);
  return entries.length;
}

function updateEnrichButton() {
  let button = $('btnEnrich');
  if (!state.doc) { button?.remove(); return; }
  if (!button) {
    button = el('button', 'btn ghost', '');
    button.id = 'btnEnrich';
    button.onclick = onEnrichClick;
    $('btnStats').before(button);
  }
  const count = state.doc.extra?.length || 0;
  button.textContent = count ? `✦ ${count} words` : '✦ Enrich';
  button.title = count
    ? `Claude aligned ${count} extra words for this text. Click to redo.`
    : 'Use Claude to translate this text’s own vocabulary, so the dial can go all the way up.';
  button.classList.toggle('on', count > 0);
}

async function onEnrichClick() {
  if (!prefs.apiKey) { panelSettings('You need an Anthropic API key for this.'); return; }
  openPanel('Enrich with Claude', (body) => {
    const status = el('div', 'status');
    body.append(el('div', 'note', 'Claude reads this text and returns the Spanish for its own vocabulary, in context, each rated for difficulty. Those words join the dial — so a piece about sailing gets its sailing words, not just the standard list. Your key is sent only to api.anthropic.com.'));
    body.append(status);
    busy(status, 'Starting…');
    enrich(state.doc, status).catch((err) => fail(status, err.message));
  });
}

// ── library ─────────────────────────────────────────────────────────────────

function panelLibrary() {
  openPanel('Library', async (body) => {
    body.append(el('div', 'empty', 'Loading…'));
    const docs = (await db.all()) || [];
    body.textContent = '';
    const sample = el('button', 'btn', 'Load the sample passage');
    sample.onclick = async () => {
      await loadDoc(makeDoc({ title: SAMPLE.title, author: SAMPLE.author, text: SAMPLE.text }));
      closePanel();
    };
    body.append(field(null, sample));
    if (!docs.length) { body.append(el('div', 'empty', 'Nothing saved yet.')); return; }
    docs.sort((a, b) => b.added - a.added);
    for (const doc of docs) {
      const card = el('div', 'card');
      const grow = el('div', 'grow');
      grow.append(el('h3', null, doc.title));
      const bits = [
        `${doc.words || 0} words`,
        doc.sections.length > 1 ? `${doc.sections.length} parts` : null,
        doc.source || null,
        doc.extra?.length ? `✦ ${doc.extra.length}` : null,
      ].filter(Boolean);
      grow.append(el('div', 'sub', bits.join(' · ')));
      if (doc.sections.length > 1) {
        const bar = el('div', 'bar');
        const fill = el('i');
        fill.style.width = `${Math.round(((doc.position || 0) / (doc.sections.length - 1)) * 100)}%`;
        bar.append(fill);
        grow.append(bar);
      }
      const open = el('button', 'btn', 'Read');
      open.onclick = async () => { await loadDoc(doc, { persist: false }); closePanel(); };
      const remove = el('button', 'btn ghost', '✕');
      remove.title = 'Delete';
      remove.onclick = async () => { await db.remove(doc.id); card.remove(); };
      card.append(grow, open, remove);
      body.append(card);
    }
  });
}

// ── everyday scenes ─────────────────────────────────────────────────────────

async function loadScene(scene, { drill = false } = {}) {
  const doc = makeDoc({ title: scene.title, author: scene.blurb, text: sceneToText(scene), source: 'scene' });
  doc.kind = 'scene';
  doc.sceneId = scene.id;
  doc.phrases = scene.phrases;
  state.mode = drill ? 'drill' : 'read';
  await loadDoc(doc);
}

function panelScenes() {
  openPanel('Everyday scenes', (body) => {
    body.append(el('div', 'note', 'Short dialogues for the situations you actually stand in. Read one at your current setting, or drill its phrases: the English, a gap to say it into, then the Spanish. The phrases are written out in full — at a till you want the thing people say, not a word-by-word weave.'));

    const everything = el('button', 'btn', `Drill all ${allPhrases().length} phrases`);
    everything.onclick = async () => {
      const doc = makeDoc({ title: 'Every phrase', author: 'All the scenes, shuffled together', text: 'Phrase drill.', source: 'drill' });
      doc.kind = 'scene';
      doc.phrases = allPhrases();
      state.mode = 'drill';
      await loadDoc(doc);
      closePanel();
    };
    body.append(field(null, everything));

    for (const group of sceneGroups()) {
      const head = el('div', 'field');

  const heading = el('div', 'field');

  body.append(el('div', 'note', 'The Listen button uses your device\u2019s own voices, which are free but cannot be recorded. For a file — for your phone, the car, a run — this calls a cloud voice service with your key: each Spanish word to a Spanish voice, each gloss to an English one, joined into one MP3. Current Kindles will not play a sideloaded MP3; this is for a phone.'));

  provider.value = prefs.ttsProvider;

  const key = el('input');

  const keyFor = () => prefs.ttsKeys[provider.value] || '';
  const voicesFor = () => prefs.ttsVoices[provider.value] || {};

  const fillVoiceSelect = (select, list, lang, current) => {
    select.textContent = '';
    const auto = el('option', null, list.length ? 'Choose a voice' : 'Load voices first');
    auto.value = '';

  };

  const showCost = () => {
    if (!state.doc) return;
    const sentences = narrationFor(options.whole);
    const guess = estimateAudio(sentences, { provider: provider.value });
    cost.textContent = `${guess.characters.toLocaleString()} characters over ${guess.requests} requests — roughly ${guess.minutes} minutes of audio. Glossing fewer words (Settings) makes both smaller.`;
  };

  const syncProvider = () => {
    key.value = keyFor();
    key.placeholder = PROVIDERS[provider.value].keyLabel;
    const stored = voicesFor();
    fillVoiceSelect(esVoice, [], 'es', stored.es);
    fillVoiceSelect(enVoice, [], 'en', stored.en);
    if (stored.esName) { const o = el('option', null, stored.esName); o.value = stored.es; esVoice.append(o); esVoice.value = stored.es; }
    if (stored.enName) { const o = el('option', null, stored.enName); o.value = stored.en; enVoice.append(o); enVoice.value = stored.en; }
    showCost();
  };

  provider.onchange = () => { prefs.ttsProvider = provider.value; savePrefs(); syncProvider(); };
  key.oninput = () => { prefs.ttsKeys[provider.value] = key.value.trim(); savePrefs(); };
  const rememberVoice = (lang, select) => {
    const store = prefs.ttsVoices[provider.value] || (prefs.ttsVoices[provider.value] = {});
    store[lang] = select.value;
    store[lang + 'Name'] = select.selectedOptions[0]?.textContent || '';
    savePrefs();
  };
  esVoice.onchange = () => rememberVoice('es', esVoice);
  enVoice.onchange = () => rememberVoice('en', enVoice);

  loadVoices.onclick = async () => {
    if (!keyFor()) { fail(status, 'Add the key first.'); return; }
    busy(status, 'Fetching the voice list…');
    try {
      const list = await listVoices(provider.value, { apiKey: keyFor() });
      const stored = voicesFor();
      fillVoiceSelect(esVoice, list, 'es', stored.es);
      fillVoiceSelect(enVoice, list, 'en', stored.en);
      done(status, `${list.length} voices. Pick one for each language.`);
    } catch (err) { fail(status, err.message); }
  };

  const render = el('button', 'btn primary', '↓ Render MP3');
  let cancel = null;
  render.onclick = async () => {
    if (cancel) { cancel.abort(); cancel = null; render.textContent = '↓ Render MP3'; return; }
    if (!keyFor()) { fail(status, 'Add an API key for the voice service.'); return; }
    cancel = new AbortController();
    render.textContent = 'Stop';
    busy(status, 'Starting…');
    try {
      const sentences = narrationFor(options.whole);
      const result = await renderAudio(sentences, {
        provider: provider.value,
        apiKey: keyFor(),
        voices: { es: esVoice.value, en: enVoice.value },
        rate: Number(prefs.rate) || 1,
        signal: cancel.signal,
        onProgress: ({ done: d, total }) => busy(status, `Voicing ${d} of ${total} passages…`),
      });
      busy(status, 'Saving…');
      await download(result.blob, `${safeName(state.doc.title)}-${prefs.level}pc.mp3`, 'audio/mpeg');
      done(status, `Done — ${result.requests} passages, ${result.characters.toLocaleString()} characters.`);
    } catch (err) {
      if (err.name === 'AbortError') done(status, 'Stopped.');
      else fail(status, err.message);
    } finally {
      cancel = null;
      render.textContent = '↓ Render MP3';
    }
  };

  body.append(
    field('Voice service', provider, PROVIDERS[prefs.ttsProvider].keyHint),
    field('Key', key, 'Kept in this browser only, and sent only to the service you picked.'),
  );
  const voiceRow = el('div', 'row2');
  voiceRow.append(esVoice, enVoice);
  body.append(field('Spanish and English voices', voiceRow), loadVoices, field(null, render, ''), cost, status);
  refreshAudioEstimate = showCost;
  syncProvider();
}

const safeName = (s) => (s || 'diglot').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);

function sectionsToExport(whole) {
  return whole ? state.doc.sections : [currentText()];
}

function weaveOne(text) {
  return applyLevel(analyze(text, state.index), {
    level: prefs.level, articles: prefs.articles, firstHint: false,
    known: vocab.known, blocked: vocab.blocked,
  });
}

function weaveText(text) {
  return weaveOne(text).nodes.map((n) => n.text).join('');
}

/** Narration for a stretch of the document — used by the audio export. */
function narrationFor(whole) {
  const sentences = [];
  for (const section of sectionsToExport(whole)) {
    for (const sentence of buildNarration(weaveOne(section).nodes, narrationOptions()).sentences) {
      sentences.push({ ...sentence, index: sentences.length });
    }
  }
  return sentences;
}

function collectVocab(whole) {
  const seen = new Map();
  for (const section of sectionsToExport(whole)) {
    for (const node of weaveOne(section).nodes) {
      if (node.kind === 'swap' && node.pos !== 'det' && !seen.has(node.text.toLowerCase())) {
        seen.set(node.text.toLowerCase(), { es: node.text, en: node.en });
      }
    }
  }
  return [...seen.values()];
}

const escapeHtml = (s) => s.replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

function exportEpub({ gloss, vocab: withVocab, whole }) {
  const seen = new Set();
  const chapters = sectionsToExport(whole).map((section, i) => {
    const nodes = weaveOne(section).nodes;
    let html = '<p>';
    for (const node of nodes) {
      if (node.kind === 'swap') {
        const first = !seen.has(node.key);
        seen.add(node.key);
        html += `<span class="es">${escapeHtml(node.text)}</span>`;
        if (gloss && first && node.pos !== 'det') html += ` <span class="gloss">(${escapeHtml(node.en)})</span>`;
      } else {
        html += escapeHtml(node.text).replace(/\n{2,}/g, '</p>\n<p>').replace(/\n/g, ' ');
      }
    }
    html += '</p>';
    return {
      title: whole && state.doc.sections.length > 1 ? `${state.doc.title} — part ${i + 1}` : state.doc.title,
      html: html.replace(/<p>\s*<\/p>/g, ''),
    };
  });
  return buildEpub({
    title: `${state.doc.title} (${prefs.level}% Spanish)`,
    author: state.doc.author || 'Diglot',
    chapters,
    vocab: withVocab ? collectVocab(whole) : [],
    level: prefs.level,
  });
}

// Saving a file. A plain link works everywhere the app is served normally;
// inside a sandboxed host (a published Claude artifact) links are inert, so
// hand the file to the host's own save prompt when it offers one.
let saver;
async function download(data, filename, type) {
  const blob = new Blob([data], { type });
  if (saver === undefined) {
    saver = typeof window.claude?.use === 'function'
      ? await window.claude.use('downloads').catch(() => null)
      : null;
  }
  if (saver) {
    try {
      await saver.save({ filename, data: blob });
      return;
    } catch (err) {
      if (err?.code === 'declined') throw new Error('Save cancelled.');
      if (err?.code) throw new Error(`Could not save here (${err.code}).`);
      throw err;
    }
  }
  const url = URL.createObjectURL(blob);
  const link = el('a');
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
