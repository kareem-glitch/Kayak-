<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a6b5c'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E" />
<title>Diglot — read your way into Spanish</title>
<meta name="description" content="Reads English text with Spanish woven in, at whatever difficulty you set." />
<style>
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --surface-2: #f4f2ee;
    --ink: #21201d; --ink-2: #57534e; --ink-3: #8f8a83;
    --line: #e5e1da; --line-2: #d6d1c8;
    --es: #0a6b5c; --es-bg: #e4f2ef; --es-known: #7a5cc4; --es-known-bg: #eee9fb;
    --accent: #b4531f; --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(20,18,15,.06), 0 8px 24px rgba(20,18,15,.08);
    --radius: 10px;
  }
  /* Dark theme, three ways: the viewer's OS preference when they have made
     no explicit choice, and either explicit stamp from the host. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a; --surface: #1e1d23; --surface-2: #26252c;
      --ink: #e9e7e3; --ink-2: #aca8a2; --ink-3: #7c7873;
      --line: #302e36; --line-2: #3d3a44;
      --es: #4fc4ae; --es-bg: #14322d; --es-known: #b39cf0; --es-known-bg: #241f38;
      --accent: #e2793c; --accent-ink: #1a1206;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a; --surface: #1e1d23; --surface-2: #26252c;
    --ink: #e9e7e3; --ink-2: #aca8a2; --ink-3: #7c7873;
    --line: #302e36; --line-2: #3d3a44;
    --es: #4fc4ae; --es-bg: #14322d; --es-known: #b39cf0; --es-known-bg: #241f38;
    --accent: #e2793c; --accent-ink: #1a1206;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }

  /* ── chrome ─────────────────────────────────────────────── */
  header.top {
    position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .top-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1100px; margin: 0 auto; }
  .brand { font-weight: 650; letter-spacing: -0.02em; font-size: 17px; display: flex; align-items: center; gap: 7px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--es); }
  .doc-title {
    flex: 1; min-width: 0; color: var(--ink-2); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn {
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px;
    padding: 6px 11px; font-size: 13px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 550; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.on { background: var(--es-bg); border-color: var(--es); color: var(--es); }

  /* ── difficulty strip ───────────────────────────────────── */
  .dial { border-top: 1px solid var(--line); background: var(--surface); }
  .dial-inner { max-width: 1100px; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center; gap: 14px; }
  .dial label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; min-width: 120px; height: 22px; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--es) var(--pct, 25%), var(--line-2) var(--pct, 25%));
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line-2); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--es); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--es); box-shadow: var(--shadow);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--es);
  }
  .readout { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .readout b { color: var(--ink); font-size: 15px; }
  .stage { font-size: 12px; color: var(--ink-3); }

  /* ── reader ─────────────────────────────────────────────── */
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 120px; }
  .reader {
    max-width: 36em; margin: 26px auto 0;
    font-family: Iowan Old Style, Palatino, Georgia, "Times New Roman", serif;
    font-size: var(--reader-size, 19px); line-height: 1.72;
  }
  .reader h1.title { font-size: 1.5em; line-height: 1.25; margin: 0 0 .1em; letter-spacing: -0.01em; }
  .reader .byline { font-family: system-ui, sans-serif; font-size: 12px; color: var(--ink-3); margin-bottom: 1.4em; }
  .reader p { margin: 0 0 1.05em; }
  .es {
    color: var(--es); background: var(--es-bg); border-radius: 4px; padding: 0 2px; margin: 0 -1px;
    cursor: pointer; text-decoration: underline; text-decoration-style: dotted;
    text-decoration-color: color-mix(in srgb, var(--es) 45%, transparent); text-underline-offset: 3px;
  }
  .es.known { color: var(--es-known); background: var(--es-known-bg); text-decoration: none; }
  .es.speaking { outline: 2px solid var(--accent); outline-offset: 1px; }
  .es .hint { font-size: .68em; color: var(--ink-3); font-family: system-ui, sans-serif; }
  .peek .es::after {
    content: " (" attr(data-en) ")"; font-size: .68em; color: var(--ink-3);
    font-family: system-ui, sans-serif;
  }
  .sentence.speaking { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 4px; }
  .es.saying { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--es-bg); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  .section-break { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  .who {
    display: inline-block; font-family: system-ui, sans-serif; font-size: .62em;
    font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); margin-right: .55em; vertical-align: .12em;
  }
  .who.b { color: var(--accent); }
  .turn { margin-bottom: .8em; }
  /* phrase drill */
  .drill { display: grid; gap: 2px; }
  .drill .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 9px 10px;
    border-radius: 8px; align-items: baseline;
  }
  .drill .row:nth-child(odd) { background: var(--surface); }
  .drill .row.speaking { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .drill .en { color: var(--ink-2); font-size: .82em; font-family: system-ui, sans-serif; }
  .drill .es { color: var(--es); background: none; text-decoration: none; cursor: default; padding: 0; }
  .drill.cover .es { filter: blur(5px); transition: filter .12s; }
  .drill.cover .row:hover .es, .drill.cover .row.speaking .es, .drill.cover .row.shown .es { filter: none; }
  @media (max-width: 560px) { .drill .row { grid-template-columns: 1fr; gap: 2px; } }
  .section-nav { display: flex; justify-content: space-between; gap: 10px; margin: 30px auto 0; max-width: 36em; }

  /* ── word popover ───────────────────────────────────────── */
  #pop {
    position: absolute; z-index: 60; display: none; min-width: 210px; max-width: 300px;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 13px;
  }
  #pop .word { font-size: 17px; font-weight: 600; color: var(--es); }
  #pop .en { font-size: 14px; margin-top: 1px; }
  #pop .meta { font-size: 11px; color: var(--ink-3); margin-top: 5px; text-transform: uppercase; letter-spacing: .05em; }
  #pop .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  #pop .row .btn { flex: 1; text-align: center; padding: 5px 8px; font-size: 12px; }

  /* ── panels ─────────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(10,9,8,.4); z-index: 40; display: none; }
  .scrim.open { display: block; }
  .panel {
    position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(520px, 100%);
    background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow);
    transform: translateX(100%); transition: transform .18s ease; overflow-y: auto;
  }
  .panel.open { transform: none; }
  .panel-head {
    position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .panel-head h2 { font-size: 15px; margin: 0; }
  .panel-body { padding: 16px 18px 40px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); }
  .tab.on { background: var(--surface); border-color: var(--line-2); color: var(--ink); font-weight: 550; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; font-weight: 550; }
  .field .help { font-size: 12px; color: var(--ink-3); margin-top: 5px; line-height: 1.45; }
  input[type=text], input[type=url], input[type=password], textarea, select {
    width: 100%; background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 8px; padding: 9px 10px; font-size: 14px;
  }
  textarea { min-height: 190px; resize: vertical; line-height: 1.5; font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--es); outline-offset: -1px; border-color: transparent; }
  .row2 { display: flex; gap: 10px; align-items: center; }
  .row2 > * { flex: 1; }
  .check { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 11px; font-size: 14px; }
  .check input { margin-top: 3px; flex: none; width: 16px; height: 16px; accent-color: var(--es); }
  .check span small { display: block; color: var(--ink-3); font-size: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 13px; margin-bottom: 9px; display: flex; gap: 12px; align-items: flex-start;
  }
  .card .grow { flex: 1; min-width: 0; }
  .card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .card .sub { font-size: 12px; color: var(--ink-3); }
  .card .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .card .bar i { display: block; height: 100%; background: var(--es); }
  .empty { color: var(--ink-3); font-size: 13px; text-align: center; padding: 30px 10px; }

  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 14px; }
  .stats b { display: block; font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  .wordlist { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--line); color: var(--ink-2);
  }
  .chip b { color: var(--es); font-weight: 600; }
  .note {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-bottom: 14px;
  }
  .note code { font-size: 12px; background: var(--surface); padding: 1px 4px; border-radius: 4px; border: 1px solid var(--line); }
  .status { font-size: 13px; color: var(--ink-2); margin-top: 10px; min-height: 20px; }
  .status.error { color: #c0392b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status.error { color: #ff8a7a; } }
  :root[data-theme="dark"] .status.error { color: #ff8a7a; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line-2);
    border-top-color: var(--es); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── playback bar ───────────────────────────────────────── */
  .playbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 35;
    display: none; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px;
    box-shadow: var(--shadow); max-width: calc(100vw - 24px); flex-wrap: wrap;
  }
  .playbar.on { display: flex; }
  .playbar .label { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .playbar select { width: auto; padding: 4px 6px; font-size: 12px; border-radius: 6px; }
  .playbar .btn { padding: 6px 10px; }
  .playbar .btn.round { border-radius: 999px; min-width: 38px; text-align: center; }
  .playbar input[type=range] { width: 130px; min-width: 90px; flex: 1 1 110px; }
  .playbar .warn { font-size: 11px; color: var(--accent); max-width: 220px; line-height: 1.35; }
  @media (max-width: 560px) { .playbar { left: 12px; right: 12px; transform: none; max-width: none; } }

  @media (max-width: 640px) {
    .top-row { flex-wrap: wrap; }
    .doc-title { order: 3; flex-basis: 100%; }
    .reader { font-size: var(--reader-size, 18px); }
    .stage { display: none; }
    /* The dial row has more in it than a phone is wide: let it wrap, with the
       slider and its reading on the first line and the buttons under them. */
    .dial-inner { gap: 8px 10px; flex-wrap: wrap; padding: 8px 16px; }
    .dial label { display: none; }
    .dial-inner input[type=range] { flex: 1 1 140px; }
    .readout { font-size: 12px; }
    .dial-inner .btn { flex: 0 0 auto; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand"><span class="dot"></span>Diglot</div>
    <div class="doc-title" id="docTitle">Nothing loaded</div>
    <button class="btn" id="btnAdd">+ Text</button>
    <button class="btn ghost" id="btnScenes">Scenes</button>
    <button class="btn ghost" id="btnLibrary">Library</button>
    <button class="btn ghost" id="btnStats">Progress</button>
    <button class="btn ghost" id="btnExport">Export</button>
    <button class="btn ghost" id="btnSettings" title="Settings">⚙</button>
  </div>
  <div class="dial">
    <div class="dial-inner">
      <label for="level">Spanish</label>
      <input type="range" id="level" min="0" max="100" value="25" step="1" />
      <div class="readout"><b id="levelOut">25</b>% dial · <span id="actualOut">0</span>% of words</div>
      <div class="stage" id="stageOut">easing in</div>
      <button class="btn ghost" id="btnDrill" title="Practise this scene's phrases" hidden>Drill</button>
    <button class="btn ghost" id="btnPeek" title="Hold to see the English (or press and hold P)">Peek</button>
      <button class="btn ghost" id="btnListen" title="Read aloud">▶ Listen</button>
    </div>
  </div>
</header>

<main>
  <div class="reader" id="reader"></div>
  <div class="section-nav" id="sectionNav"></div>
</main>

<div id="pop"></div>

<div class="playbar" id="playbar">
  <button class="btn ghost round" id="playPrev" title="Previous sentence (,)">⏮</button>
  <button class="btn primary round" id="playPause" title="Pause (space)">❙❙</button>
  <button class="btn ghost round" id="playNext" title="Next sentence (.)">⏭</button>
  <span class="label" id="playLabel">—</span>
  <input type="range" id="playSeek" min="0" max="0" value="0" step="1" title="Scrub through the text" />
  <select id="rate" title="Speed">
    <option value="0.7">0.7×</option><option value="0.85">0.85×</option>
    <option value="1" selected>1×</option><option value="1.15">1.15×</option>
    <option value="1.3">1.3×</option><option value="1.5">1.5×</option>
  </select>
  <select id="sleep" title="Sleep timer">
    <option value="0">No timer</option><option value="5">5 min</option>
    <option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option>
  </select>
  <button class="btn ghost round" id="playStop" title="Stop (Esc)">✕</button>
  <div class="warn" id="playWarn" hidden></div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <h2 id="panelTitle">Panel</h2>
    <button class="btn ghost" id="panelClose">Close ✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<script type="module">
// ── src/diglot/phrasebook.js ──────────────────────────────────
// Situational phrases, in the same difficulty bands as the main lexicon.
//
// These matter more than their word count suggests. A word-for-word weave of
// "how much is it" gives you "cómo mucho es eso", which is not Spanish and not
// what anyone says. Phrases are matched before single words, so once the dial
// reaches their tier the whole chunk turns into the thing a person actually
// says at the till.

// Everyday nouns the scenes lean on. They live here rather than in the main
// lexicon because they belong to the same errand: tills, menus, platforms.
const EVERYDAY_NOUNS = [
  // band 1
  [
    'bread|pan|n|m', 'cheese|queso|n|m', 'meat|carne|n|f', 'chicken|pollo|n|m',
    'egg|huevo|n|m', 'rice|arroz|n|m', 'fish|pescado|n|m', 'potato|patata|n|f', 'tomato|tomate|n|m',
    'apple|manzana|n|f', 'orange|naranja|n|f', 'lemon|limón|n|m', 'onion|cebolla|n|f',
    'salt|sal|n|f', 'sugar|azúcar|n|m', 'oil|aceite|n|m', 'soup|sopa|n|f',
    'salad|ensalada|n|f', 'cake|tarta|n|f', 'ice cream|helado|n|m',
    'breakfast|desayuno|n|m', 'lunch|comida|n|f', 'dinner|cena|n|f',
    'glass|vaso|n|m', 'plate|plato|n|m', 'fork|tenedor|n|m', 'knife|cuchillo|n|m',
    'spoon|cuchara|n|f', 'napkin|servilleta|n|f', 'menu|carta|n|f',
    'waiter|camarero|n|m', 'bill|cuenta|n|f', 'ticket|billete|n|m',
  ],
  // band 2
  [
    'station|estación|n|f', 'airport|aeropuerto|n|m', 'platform|andén|n|m',
    'seat|asiento|n|m', 'suitcase|maleta|n|f', 'bag|bolsa|n|f',
    'passport|pasaporte|n|m', 'wallet|cartera|n|f', 'card|tarjeta|n|f',
    'cash|efectivo|n|m', 'small change|cambio|n|m', 'receipt|recibo|n|m',
    'supermarket|supermercado|n|m', 'bakery|panadería|n|f',
    'chemist|farmacia|n|f', 'pharmacy|farmacia|n|f', 'square|plaza|n|f',
    'corner|esquina|n|f', 'toilet|baño|n|m', 'lift|ascensor|n|m',
    'floor|planta|n|f', 'reservation|reserva|n|f', 'password|contraseña|n|f',
    'taxi|taxi|n|m', 'bus stop|parada de autobús|n|f', 'timetable|horario|n|m',
    'throat|garganta|n|f', 'stomach|estómago|n|m', 'fever|fiebre|n|f',
    'life jacket|chaleco salvavidas|n|m', 'buoy|boya|n|f', 'tide|marea|n|f',
  ],
];

const PHRASE_BANDS = [
  // ── Band 0 · the ones you use on day one ──────────────────────────────────
  [
    'hello|hola|phrase', 'hi|hola|phrase', 'goodbye|adiós|phrase',
    'good afternoon|buenas tardes|phrase', 'good evening|buenas tardes|phrase',
    'good night|buenas noches|phrase', 'see you later|hasta luego|phrase',
    'see you tomorrow|hasta mañana|phrase', 'see you soon|hasta pronto|phrase',
    'thanks|gracias|phrase', 'thank you very much|muchas gracias|phrase',
    "you're welcome|de nada|phrase", 'excuse me|perdone|phrase',
    "i'm sorry|lo siento|phrase", 'sorry|perdón|phrase',
    'yes please|sí, por favor|phrase', 'no thank you|no, gracias|phrase',
    'there is|hay|phrase', 'there are|hay|phrase', 'is there|hay|phrase',
    'is there room|hay sitio|phrase', 'there is room|hay sitio|phrase',
    'are there|hay|phrase', 'there was|había|phrase', 'there were|había|phrase',
  ],

// ── src/diglot/morph.js ───────────────────────────────────────
// Spanish morphology: just enough inflection to make woven words fit their
// English slot. Pure functions, no data beyond what's passed in.

const VOWELS = 'aeiouáéíóú';

/** Strip the accent from the last accented vowel (canción -> cancion). */
function deaccentLast(word) {
  const map = { á: 'a', é: 'e', í: 'i', ó: 'o', ú: 'u' };
  const i = [...word].reduce((best, ch, idx) => (map[ch] ? idx : best), -1);
  if (i === -1) return word;
  return word.slice(0, i) + map[word[i]] + word.slice(i + 1);
}

// Words that gain a written accent in the plural, because the stress stays put
// while the word grows a syllable.
const ACCENTED_PLURALS = {
  joven: 'jóvenes', examen: 'exámenes', imagen: 'imágenes', origen: 'orígenes',
  orden: 'órdenes', crimen: 'crímenes', resumen: 'resúmenes', margen: 'márgenes',
  volumen: 'volúmenes', carácter: 'caracteres', régimen: 'regímenes',
};

/** Pluralise a Spanish noun or adjective. */
function pluralize(word) {
  if (!word) return word;
  const known = ACCENTED_PLURALS[word.toLowerCase()];
  if (known) return matchCase(known, word);
  const parts = word.split(' ');
  if (parts.length > 1) {
    // Pluralise the head noun of a phrase ("país vasco" -> "países vascos").
    return parts.map((p, i) => (i <= 1 ? pluralize(p) : p)).join(' ');
  }
  const last = word.slice(-1).toLowerCase();
  if (word.length > 2 && /ión$/i.test(word)) return deaccentLast(word) + 'es';
  if (last === 'z') return word.slice(0, -1) + 'ces';
  if (last === 's' || last === 'x') {
    // Already plural-looking and stressed on the last syllable? Leave it.
    return /[áéíóú]/.test(word.slice(-3)) ? word.slice(0, -1) + 'es' : word;
  }
  if (VOWELS.includes(last)) {
    if ('áéíóú'.includes(last)) return word + 's';
    return word + 's';
  }
  if (last === 'í' || last === 'ú') return word + 'es';
  return word + 'es';
}

/** Make an adjective agree with a noun's gender and number. */
function agree(adj, gender = 'm', plural = false) {
  if (!adj) return adj;
  if (adj.includes(' ')) {
    const [head, ...rest] = adj.split(' ');
    return [agree(head, gender, plural), ...rest].join(' ');
  }
  let out = adj;
  const lower = adj.toLowerCase();
  if (gender === 'f') {
    if (lower.endsWith('o')) out = adj.slice(0, -1) + 'a';
    else if (/(dor|tor|ón|án|és)$/.test(lower)) out = deaccentLast(adj) + 'a';
  }
  return plural ? pluralize(out) : out;
}

/**
 * Apocope: a few adjectives lose their ending before a masculine singular noun
 * — "un buen día", not "un bueno día".
 */
function apocopate(adj, gender, plural) {
  if (plural) return adj;
  const table = { bueno: 'buen', malo: 'mal', primero: 'primer', tercero: 'tercer', alguno: 'algún', ninguno: 'ningún' };
  const lower = adj.toLowerCase();
  if (gender === 'm' && table[lower]) return matchCase(table[lower], adj);
  if (lower === 'grande') return matchCase('gran', adj);
  return adj;
}

/** Definite / indefinite articles. */
function article(kind, gender = 'm', plural = false, noun = '') {
  // "el agua", "un águila": a feminine noun beginning with a stressed a-
  // borrows the masculine singular article.
  if (gender === 'f' && !plural && /^(a|á|ha)/i.test(noun) && /^(agua|águila|alma|área|arma|aula|hambre|hacha|ala|ave)$/i.test(noun)) {
    gender = 'm';
  }
  const table = {
    definite: { m: ['el', 'los'], f: ['la', 'las'] },
    indefinite: { m: ['un', 'unos'], f: ['una', 'unas'] },
    demonstrative: { m: ['este', 'estos'], f: ['esta', 'estas'] },
    that: { m: ['ese', 'esos'], f: ['esa', 'esas'] },
  };
  const row = (table[kind] || table.definite)[gender === 'f' ? 'f' : 'm'];
  return row[plural ? 1 : 0];
}

/** Possessives inflect for number only (mi/mis), except nuestro. */
function possessive(word, plural, gender = 'm') {
  if (!word) return word;
  if (word === 'nuestro') return agree('nuestro', gender, plural);
  return plural ? pluralize(word) : word;
}

/**
 * Conjugate a Spanish infinitive.
 * form: 'inf' | 'pres3' | 'pres3p' | 'pret3' | 'pret3p' | 'ger' | 'part'
 */
function conjugate(inf, form = 'inf') {
  if (!inf) return inf;
  if (form === 'inf') return inf;
  // Reflexives: conjugate the verb, drop the clitic.
  const reflexive = /se$/.test(inf) && inf.length > 4;
  const base = reflexive ? inf.slice(0, -2) : inf;
  const irr = IRREGULAR[base];
  if (irr && irr[form]) return prefixSe(irr[form], reflexive, form);
  const stem = base.slice(0, -2);
  const ending = base.slice(-2).toLowerCase().replace('í', 'i');
  const table = {
    ar: { pres1: 'o', pres2: 'as', pres3: 'a', pres1p: 'amos', pres3p: 'an', pret3: 'ó', pret3p: 'aron', ger: 'ando', part: 'ado' },
    er: { pres1: 'o', pres2: 'es', pres3: 'e', pres1p: 'emos', pres3p: 'en', pret3: 'ió', pret3p: 'ieron', ger: 'iendo', part: 'ido' },
    ir: { pres1: 'o', pres2: 'es', pres3: 'e', pres1p: 'imos', pres3p: 'en', pret3: 'ió', pret3p: 'ieron', ger: 'iendo', part: 'ido' },
  }[ending];
  if (!table) return inf;
  return prefixSe(stem + table[form], reflexive, form);
}

function prefixSe(word, reflexive, form) {
  if (!reflexive) return word;
  if (form === 'ger') return word + 'se';
  return 'se ' + word;
}

/** Copy the capitalisation pattern of `model` onto `word`. */
function matchCase(word, model) {
  if (!model || !word) return word;
  if (model === model.toUpperCase() && model.length > 1 && /[A-Z]/.test(model)) return word.toUpperCase();
  if (model[0] === model[0].toUpperCase() && model[0] !== model[0].toLowerCase()) {
    return word[0].toUpperCase() + word.slice(1);
  }
  return word;
}


// ── src/diglot/weave.js ───────────────────────────────────────
// The diglot weaver: turns English text into English-with-Spanish-woven-in.
//
// Two stages on purpose:
//   analyze(text)            → slow-ish, once per document. Finds every word
//                              that *could* be Spanish and how hard it is.
//   applyLevel(analysis, o)  → fast, on every slider move. Decides which of
//                              those actually turn Spanish, and inflects them
//                              to fit the sentence around them.
// That split is what makes the slider feel instant on a whole chapter.



// ── index ───────────────────────────────────────────────────────────────────

/** Build the lookup table. Rank is a 0–100 "difficulty" position in the list. */
function buildIndex(bands = BANDS) {
  const byKey = new Map();
  let maxPhrase = 1;
  bands.forEach((band, b) => {
    band.forEach((entry, i) => {
      const [en, es, pos, extra] = entry.split('|');
      const key = en.toLowerCase();
      if (byKey.has(key)) return; // first band wins: earlier = easier
      const rank = ((b + (i + 0.5) / band.length) / bands.length) * 100;
      const words = key.split(' ').length;
      if (words > maxPhrase) maxPhrase = words;
      byKey.set(key, { key, en, es, pos, gender: extra === 'f' ? 'f' : 'm', rank, band: b, words });
    });
  });
  return { byKey, maxPhrase, size: byKey.size };
}

const DEFAULT_INDEX = buildIndex();

// ── English morphology (just enough to look words up) ───────────────────────

const IRREGULAR_NOUNS = {
  children: 'child', men: 'man', women: 'woman', feet: 'foot', teeth: 'tooth',
  mice: 'mouse', geese: 'goose', lives: 'life', wives: 'wife', knives: 'knife',
  leaves: 'leaf', shelves: 'shelf', halves: 'half', thieves: 'thief',
  people: 'person', cities: 'city', countries: 'country',
};

const IRREGULAR_VERBS = {
  was: ['be', 'past'], were: ['be', 'past'], been: ['be', 'part'], am: ['be', 'pres1'],
  went: ['go', 'past'], gone: ['go', 'part'], goes: ['go', 'pres3'],
  had: ['have', 'past'], has: ['have', 'pres3'],
  did: ['do', 'past'], done: ['do', 'part'], does: ['do', 'pres3'],
  said: ['say', 'past'], made: ['make', 'past'], took: ['take', 'past'],
  taken: ['take', 'part'], came: ['come', 'past'], saw: ['see', 'past'],
  seen: ['see', 'part'], knew: ['know', 'past'], known: ['know', 'part'],
  gave: ['give', 'past'], given: ['give', 'part'], found: ['find', 'past'],
  thought: ['think', 'past'], told: ['tell', 'past'], became: ['become', 'past'],
  left: ['leave', 'past'], felt: ['feel', 'past'], brought: ['bring', 'past'],
  began: ['begin', 'past'], begun: ['begin', 'part'], kept: ['keep', 'past'],
  held: ['hold', 'past'], wrote: ['write', 'past'], written: ['write', 'part'],
  stood: ['stand', 'past'], heard: ['hear', 'past'], meant: ['mean', 'past'],
  met: ['meet', 'past'], ran: ['run', 'past'], paid: ['pay', 'past'],
  sat: ['sit', 'past'], spoke: ['speak', 'past'], spoken: ['speak', 'part'],
  led: ['lead', 'past'], grew: ['grow', 'past'], grown: ['grow', 'part'],
  lost: ['lose', 'past'], fell: ['fall', 'past'], sent: ['send', 'past'],
  built: ['build', 'past'], understood: ['understand', 'past'],
  drew: ['draw', 'past'], broke: ['break', 'past'], broken: ['break', 'part'],
  spent: ['spend', 'past'], rose: ['rise', 'past'], bought: ['buy', 'past'],
  wore: ['wear', 'past'], chose: ['choose', 'past'], chosen: ['choose', 'part'],
  ate: ['eat', 'past'], eaten: ['eat', 'part'], drank: ['drink', 'past'],
  slept: ['sleep', 'past'], won: ['win', 'past'], taught: ['teach', 'past'],
  sang: ['sing', 'past'], swam: ['swim', 'past'], flew: ['fly', 'past'],
  died: ['die', 'past'], drove: ['drive', 'past'], sold: ['sell', 'past'],

function dedouble(stem) {
  return /([bcdfgklmnprstvz])\1$/.test(stem) ? stem.slice(0, -1) : stem;
}

/**
 * Every plausible (lemma, inflection) reading of an English word, best first.
 * Inflection: {number: 'pl'|'sg', verbForm: 'inf'|'pres3'|'past'|'ger'|'part'}
 */
function readings(word) {
  const w = word.toLowerCase();
  const out = [[w, {}]];
  if (IRREGULAR_NOUNS[w]) out.push([IRREGULAR_NOUNS[w], { number: 'pl' }]);
  if (IRREGULAR_VERBS[w]) {
    const [lemma, form] = IRREGULAR_VERBS[w];
    out.push([lemma, { verbForm: form, irregular: true }]);
  }
  const sForm = { number: 'pl', verbForm: 'pres3', ambiguous: true };
  if (w.length > 4 && w.endsWith('ies')) out.push([w.slice(0, -3) + 'y', sForm]);
  if (w.length > 4 && /(ch|sh|ss|x|z|o)es$/.test(w)) out.push([w.slice(0, -2), sForm]);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) out.push([w.slice(0, -1), sForm]);
  if (w.length > 4 && w.endsWith('ing')) {
    const stem = w.slice(0, -3);
    out.push([stem, { verbForm: 'ger' }], [stem + 'e', { verbForm: 'ger' }], [dedouble(stem), { verbForm: 'ger' }]);
  }
  if (w.length > 3 && w.endsWith('ed')) {
    const stem = w.slice(0, -2);
    out.push([stem, { verbForm: 'past' }], [w.slice(0, -1), { verbForm: 'past' }], [dedouble(stem), { verbForm: 'past' }]);
    if (stem.endsWith('i')) out.push([stem.slice(0, -1) + 'y', { verbForm: 'past' }]);
  }
  if (w.length > 4 && w.endsWith('er')) out.push([w.slice(0, -2), { degree: 'comp' }], [w.slice(0, -1), { degree: 'comp' }]);
  if (w.length > 5 && w.endsWith('est')) out.push([w.slice(0, -3), { degree: 'sup' }], [w.slice(0, -2), { degree: 'sup' }]);
  return out;
}

// ── tokenizer ───────────────────────────────────────────────────────────────

const WORD_RE = /[\p{L}\p{M}][\p{L}\p{M}'’-]*/u;

/** Split into word / non-word tokens, losing nothing. */
function tokenize(text) {
  const tokens = [];
  const re = new RegExp(WORD_RE, 'gu');
  let last = 0;
  for (const m of text.matchAll(re)) {
    if (m.index > last) tokens.push({ kind: 'gap', raw: text.slice(last, m.index) });
    tokens.push({ kind: 'word', raw: m[0] });
    last = m.index + m[0].length;
  }
  if (last < text.length) tokens.push({ kind: 'gap', raw: text.slice(last) });
  return tokens;
}

const DETERMINERS = {
  the: 'definite', a: 'indefinite', an: 'indefinite',
  this: 'demonstrative', these: 'demonstrative', that: 'that', those: 'that',
};
const POSSESSIVES = { my: 'mi', your: 'tu', his: 'su', her: 'su', its: 'su', our: 'nuestro', their: 'su' };
const SUBJECTS = {
  i: 'pres1', we: 'pres1p', you: 'pres2', they: 'pres3p',
  he: 'pres3', she: 'pres3', it: 'pres3',
};
const SENTENCE_END = /[.!?][)\]"'”’\s]*$|\n\s*$/;
const CONTRACTIONS = { de: 'del', a: 'al' };
const AUXILIARIES = ['will', 'would', 'can', 'could', 'should', 'must', 'may', 'might', 'has', 'have', 'had', 'is', 'are', 'was', 'were', 'do', 'does', 'did'];

/**
 * A few function words mean different things in different slots. Rather than
 * a part-of-speech tagger, these hand-written rules cover the handful that
 * would otherwise produce nonsense. Returning null skips the swap entirely.
 */
const CONTEXT = {
  to: (ctx) => (ctx.nextIsVerb ? null : 'a'),          // infinitive marker: leave it
  that: (ctx) => (ctx.nextIsVerb ? 'que' : null),      // relative "que" vs demonstrative
  which: (ctx) => (ctx.nextIsVerb ? 'que' : 'cual'),
  who: (ctx) => (ctx.nextIsVerb ? 'que' : 'quien'),
  i: () => 'yo',                                        // never "Yo" mid-sentence
  as: (ctx) => (ctx.nextIsVerb ? null : 'como'),
  like: (ctx) => (ctx.prevIsSubject ? null : 'como'),
};
const COPULAS = ['is', 'are', 'was', 'were', 'am', 'be', 'been', 'seems', 'seem', 'seemed', 'looks', 'look', 'looked', 'feels', 'feel', 'felt', 'became', 'become', 'stays', 'stay'];

const VERBY_BEFORE = ['who', 'that', 'which', 'i', 'you', 'he', 'she', 'it', 'we', 'they', 'to', 'not', "don't", "doesn't"];
const NOUNY_BEFORE = ['the', 'a', 'an', 'this', 'these', 'those', 'my', 'your', 'his', 'her', 'its', 'our', 'their', 'of', 'in', 'on', 'at', 'for', 'with', 'many', 'some', 'few', 'all'];

/** Nudge an ambiguous word ("lives") towards the reading its neighbour implies. */
function posScore(pos, prevWord, inflection, prevIsSubject) {
  let score = 0;
  if (pos === 'v' && (VERBY_BEFORE.includes(prevWord) || AUXILIARIES.includes(prevWord))) score += 2;
  if (pos === 'n' && NOUNY_BEFORE.includes(prevWord)) score += 2;
  if (pos === 'v' && NOUNY_BEFORE.includes(prevWord)) score -= 2;
  if (pos === 'n' && VERBY_BEFORE.includes(prevWord)) score -= 1;
  // "her neighbours thought" is a verb; "she had a thought" is a noun. An
  // irregular past form straight after a subject is almost always the verb.
  if (pos === 'v' && inflection?.irregular && prevIsSubject) score += 2.5;
  return score;
}

/** Does this word read as a noun in its own right (not as an inflected verb)? */
function nounReading(word, index) {
  for (const [lemma, inf] of readings(word)) {
    if (inf.verbForm && !inf.ambiguous) continue;
    const entry = index.byKey.get(lemma);
    if (!entry) continue;
    if (entry.pos !== 'n') return null;
    return { gender: entry.gender, plural: inf.number === 'pl' || (inf.ambiguous && /s$/.test(word)) };
  }
  return null;
}

/** Could this word be the subject of the verb that follows it? */
function subjectish(tokens, i, index) {
  if (i == null || i < 0 || tokens[i].kind !== 'word') return false;
  const word = tokens[i].raw.toLowerCase();
  if (SUBJECTS[word]) return true;
  if (/^\p{Lu}/u.test(tokens[i].raw) && !index.byKey.has(word)) return true; // a name
  return !!nounReading(word, index);
}

// ── analysis ────────────────────────────────────────────────────────────────

/**
 * Find every swappable span in the text. Returns a structure that applyLevel()
 * can render at any difficulty without re-scanning.
 */
function analyze(text, index = DEFAULT_INDEX) {
  const tokens = tokenize(text);
  const wordPositions = [];
  tokens.forEach((t, i) => { if (t.kind === 'word') wordPositions.push(i); });

  // Sentence starts: a word is sentence-initial if all that precedes it in the
  // gap is terminal punctuation (so capitals there aren't proper nouns).
  let atStart = true;
  let atLineStart = true;
  tokens.forEach((t, i) => {
    if (t.kind === 'gap') {
      if (SENTENCE_END.test(t.raw)) atStart = true;
      if (/\n/.test(t.raw)) atLineStart = true;
      return;
    }
    t.sentenceStart = atStart;
    // "Waiter: ..." — a dialogue label, not something to translate.
    if (atLineStart) {
      const after = tokens[i + 1];
      if (after && after.kind === 'gap' && /^\s*:/.test(after.raw)) t.speakerLabel = true;
    }
    // What follows the label starts the turn, so its capital is a sentence
    // capital, not a name — otherwise the first word of every line of dialogue
    // is mistaken for a proper noun and left in English.
    atStart = t.speakerLabel === true;
    atLineStart = false;
  });

  const candidates = [];
  const consumed = new Set();
  for (let wi = 0; wi < wordPositions.length; wi++) {
    const ti = wordPositions[wi];
    if (consumed.has(ti)) continue;
    const token = tokens[ti];
    if (token.speakerLabel) continue;

    // Phrases first (longest match wins), then the single word.
    let hit = null;
    for (let n = Math.min(index.maxPhrase, wordPositions.length - wi); n >= 2 && !hit; n--) {
      const span = wordPositions.slice(wi, wi + n);
      // Words of a phrase may be separated by spaces or a comma — "the bill,
      // please" is the same phrase as "the bill please", and its Spanish
      // brings its own punctuation.
      const glueOk = span.slice(1).every((p, k) => {
        for (let j = span[k] + 1; j < p; j++) if (!/^[\s,]+$/.test(tokens[j].raw)) return false;
        return true;
      });
      if (!glueOk) continue;
      const key = span.map((p) => tokens[p].raw.toLowerCase()).join(' ');
      const entry = index.byKey.get(key);
      if (entry) hit = { entry, span, inflection: {} };
    }
    if (!hit) {
      // Proper nouns stay English — a capital mid-sentence is a name.
      const isCapMidSentence = !token.sentenceStart && /^\p{Lu}/u.test(token.raw)
        && token.raw.toLowerCase() !== 'i';
      if (isCapMidSentence) continue;
      const prevIdx = prevWordIndex(tokens, ti);
      const prevWord = prevIdx != null ? tokens[prevIdx].raw.toLowerCase() : '';
      const prevSubjectish = subjectish(tokens, prevIdx, index);
      const options = [];
      readings(token.raw).forEach(([lemma, raw], order) => {
        const entry = index.byKey.get(lemma);
        if (!entry || entry.words > 1) return;
        let inflection = raw;
        if (raw.ambiguous) {
          // "books" is a plural noun; "walks" is a verb. The entry knows which.
          if (entry.pos === 'v') inflection = { verbForm: 'pres3' };
          else if (entry.pos === 'n') inflection = { number: 'pl' };
          else return;
        } else {
          if (inflection.verbForm && entry.pos !== 'v') return;
          if (inflection.degree && entry.pos !== 'adj' && entry.pos !== 'adv') return;
        }
        options.push({
          entry, span: [ti], inflection,
          score: posScore(entry.pos, prevWord, inflection, prevSubjectish) - order * 0.1,
        });
      });
      if (options.length) {
        options.sort((a, b) => b.score - a.score);
        hit = options[0];
      }
    }
    if (!hit) continue;
    hit.span.forEach((p) => consumed.add(p));
    wi += hit.span.length - 1;
    candidates.push({ ...hit, tokenIndex: ti, id: candidates.length });
    tokens[ti].candidate = candidates[candidates.length - 1];
  }

  const wordCount = wordPositions.length;
  return { text, tokens, candidates, wordCount, index };
}

// ── rendering at a level ────────────────────────────────────────────────────

const DEFAULTS = {
  level: 25,
  articles: true,      // "the house" → "la casa" once you're past articleLevel
  articleLevel: 35,
  known: null,         // Set of keys always woven, whatever the slider says
  blocked: null,       // Set of keys never woven
  firstHint: false,    // gloss the first appearance of each Spanish word
};

/**
 * Decide which candidates fire at this level and inflect them in context.
 * Returns render nodes plus stats.
 */
function applyLevel(analysis, options = {}) {
  const opts = { ...DEFAULTS, ...options };
  const { tokens, candidates } = analysis;
  const known = opts.known || new Set();
  const blocked = opts.blocked || new Set();

  // 1. which candidates fire
  const firing = new Map(); // tokenIndex -> candidate
  for (const c of candidates) {
    const key = c.entry.key;
    if (blocked.has(key)) continue;
    if (!known.has(key) && c.entry.rank > opts.level) continue;
    firing.set(c.tokenIndex, c);
  }

  // 2. inflect, with a look at the neighbours
  const decided = new Map();
  for (const c of firing.values()) {
    const out = inflect(c, analysis, firing, opts);
    if (out) decided.set(c.tokenIndex, out);
    else firing.delete(c.tokenIndex);
  }

  // 3. determiners: "the casa" reads better as "la casa". This also repairs
  //    determiners that fired on their own (band 9), which don't know their
  //    noun's gender until now.
  const absorbed = new Set();
  if (opts.articles) {
    for (const [ti, out] of [...decided]) {
      if (out.pos !== 'n') continue;
      const prev = prevWordIndex(tokens, ti, true);
      if (prev == null || absorbed.has(prev)) continue;
      const prevWord = tokens[prev].raw.toLowerCase();
      const detFired = firing.has(prev);
      // Below articleLevel we only fix determiners that fired by themselves.
      if (!detFired && opts.level < opts.articleLevel) continue;
      let esDet = null;
      if (DETERMINERS[prevWord]) esDet = esArticle(DETERMINERS[prevWord], out.gender, out.plural, out.es);
      else if (POSSESSIVES[prevWord]) esDet = out.plural ? pluralize(POSSESSIVES[prevWord]) : POSSESSIVES[prevWord];
      if (!esDet) continue;
      absorbed.add(prev);
      const rank = detFired ? firing.get(prev).entry.rank : out.rank;
      decided.set(prev, {
        es: matchCase(esDet, tokens[prev].raw), en: tokens[prev].raw, pos: 'det',
        key: prevWord, rank, gloss: esDet, gender: out.gender, plural: out.plural,
      });
      if (detFired) firing.delete(prev);
    }
  }

  // 4. build render nodes
  const nodes = [];
  const seen = new Set();
  let swapped = 0;
  const spanishWords = new Set();
  let lastSwapNode = null;
  let lastSwapGap = null;
  let stripColon = false;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    const out = decided.get(i);
    if (t.speakerLabel) {
      nodes.push({ kind: 'plain', text: t.raw + ':', speaker: t.raw });
      stripColon = true;
      lastSwapNode = null;
      lastSwapGap = null;
      continue;
    }
    if (!out) {
      let text = t.raw;
      if (stripColon && t.kind === 'gap') { text = text.replace(/^\s*:/, ''); stripColon = false; }
      const node = { kind: t.kind === 'gap' ? 'gap' : 'plain', text };
      nodes.push(node);
      if (t.kind === 'word') lastSwapNode = null;
      else if (/^\s+$/.test(text)) lastSwapGap = node;
      else { lastSwapNode = null; lastSwapGap = null; }
      continue;
    }
    const c = firing.get(i);
    const span = c ? c.span : [i];
    const enText = span.map((p) => tokens[p].raw).join(' ');
    const first = !seen.has(out.key);
    seen.add(out.key);
    if (out.pos !== 'det') { swapped += span.length; spanishWords.add(out.key); }
    const node = {
      kind: 'swap', text: out.es, en: enText, key: out.key, pos: out.pos,
      rank: Math.round(out.rank), gloss: out.gloss, first,
      hint: opts.firstHint && first ? enText : null,
    };
    // de + el = del, a + el = al
    const tail = lastSwapNode ? lastSwapNode.text.toLowerCase().split(' ').pop() : '';
    const contraction = lastSwapNode && lastSwapGap === nodes[nodes.length - 1]
      && CONTRACTIONS[tail] && node.text.toLowerCase() === 'el';
    if (contraction) {
      const head = lastSwapNode.text.split(' ').slice(0, -1);
      lastSwapNode.text = [...head, matchCase(CONTRACTIONS[tail], lastSwapNode.text.split(' ').pop())].join(' ');
      lastSwapNode.en += ' ' + enText;
      nodes.pop(); // the space between them
    } else {
      nodes.push(node);
      lastSwapNode = node;
    }
    lastSwapGap = null;
    i = span[span.length - 1]; // skip the rest of a phrase span
  }

  return {
    nodes,
    stats: {
      words: analysis.wordCount,
      swapped,
      ratio: analysis.wordCount ? swapped / analysis.wordCount : 0,
      uniqueSpanish: spanishWords.size,
      candidates: candidates.length,
      headroom: analysis.wordCount ? candidates.length / analysis.wordCount : 0,
    },
  };
}

function prevWordIndex(tokens, i, skipAdjectives = false) {
  let j = i - 1;
  for (; j >= 0; j--) {
    if (tokens[j].kind === 'word') break;
    if (!/^[\s"'“‘(]*$/.test(tokens[j].raw)) return null; // punctuation breaks the phrase
  }
  if (j < 0) return null;
  if (skipAdjectives) {
    // "the big red casa": walk back over modifiers to reach the determiner.
    let k = j;
    let hops = 0;
    while (k >= 0 && hops < 3) {
      const cand = tokens[k].candidate;
      const isModifier = cand && (cand.entry.pos === 'adj' || cand.entry.pos === 'adv');
      if (!isModifier) break;
      const back = prevWordIndex(tokens, k);
      if (back == null) break;
      k = back;
      hops++;
    }
    return k;
  }
  return j;
}

function nextWords(tokens, i, n) {
  const out = [];
  for (let j = i + 1; j < tokens.length && out.length < n; j++) {
    if (tokens[j].kind === 'word') out.push(j);
    else if (!/^[\s-]*$/.test(tokens[j].raw)) break;
  }
  return out;
}

/** Put a candidate's Spanish into the right shape for its English slot. */
function inflect(c, analysis, firing, opts) {
  const { tokens, index } = analysis;
  const { entry, inflection } = c;
  const ti = c.tokenIndex;
  const model = tokens[ti].raw;
  let es = entry.es;
  let plural = inflection.number === 'pl';
  let gender = entry.gender;

  const override = CONTEXT[entry.key];
  if (override) {
    const next = nextWords(tokens, c.span[c.span.length - 1], 1)[0];
    const nextWord = next != null ? tokens[next].raw.toLowerCase() : '';
    const prev = prevWordIndex(tokens, ti);
    const ctx = {
      nextIsVerb: !!nextWord && (AUXILIARIES.includes(nextWord) || isVerbWord(nextWord, index)),
      prevIsSubject: prev != null && SUBJECTS[tokens[prev].raw.toLowerCase()] !== undefined,
    };
    const forced = override(ctx);
    if (forced == null) return null;
    es = forced;
    return { es: tokens[ti].sentenceStart ? matchCase(es, 'X') : es, pos: entry.pos, key: entry.key, rank: entry.rank, gloss: es, gender, plural };
  }

  if (entry.pos === 'n') {
    if (plural) es = pluralize(es);
  } else if (entry.pos === 'adj') {
    const head = headNoun(tokens, ti, index, firing) || subjectNoun(tokens, ti, index, firing);
    if (head) { gender = head.gender; plural = head.plural; }
    else if (inflection.number === 'pl') plural = true;
    es = agree(es, gender, plural);
    if (head && head.attributive) es = apocopate(es, gender, plural);
    if (inflection.degree === 'comp') es = 'más ' + es;
    if (inflection.degree === 'sup') es = 'el más ' + es;
  } else if (entry.pos === 'v') {
    es = conjugate(es, verbForm(tokens, ti, inflection, index));
  } else if (entry.pos === 'num' && entry.key === 'one') {
    const head = headNoun(tokens, ti, index, firing);
    if (head) es = head.plural ? 'unos' : esArticle('indefinite', head.gender, false, '');
  } else if (entry.pos === 'det' || entry.pos === 'pron') {
    // leave as listed
  }

  return {
    es: matchCase(es, model), pos: entry.pos, key: entry.key, rank: entry.rank,
    gloss: entry.es, gender, plural,
  };
}

/**
 * The noun an attributive adjective modifies: "the old woman" → woman.
 * Only looks across other modifiers — a conjunction or preposition ends the
 * noun phrase, so "happy because the water" never agrees with "water".
 */
function headNoun(tokens, ti, index, firing) {
  for (const j of nextWords(tokens, ti, 3)) {
    const word = tokens[j].raw.toLowerCase();
    const fired = firing.get(j);
    if (fired && fired.entry.pos === 'n') {
      return { gender: fired.entry.gender, plural: fired.inflection.number === 'pl', attributive: true };
    }
    const asNoun = nounReading(word, index);
    if (asNoun) return { ...asNoun, attributive: true };
    let modifier = false;
    for (const [lemma, inf] of readings(word)) {
      const e = index.byKey.get(lemma);
      if (!e) continue;
      void inf;
      if (e.pos === 'adj' || e.pos === 'adv' || e.pos === 'det') { modifier = true; break; }
      return null; // a verb/preposition/conjunction ends the noun phrase
    }
    if (!modifier && !DETERMINERS[word] && !POSSESSIVES[word]) return null; // unknown word: don't guess
  }
  return null;
}

function isVerbWord(word, index) {
  for (const [lemma] of readings(word)) {
    const e = index.byKey.get(lemma);
    if (e && e.pos === 'v') return true;
  }
  return false;
}

/** For a predicate adjective ("the children were happy"), find the subject. */
function subjectNoun(tokens, ti, index, firing) {
  let sawCopula = false;
  let steps = 0;
  for (let j = ti - 1; j >= 0 && steps < 6; j--) {
    const t = tokens[j];
    if (t.kind !== 'word') {
      if (/[.!?;:]/.test(t.raw)) return null;
      continue;
    }
    steps++;
    const w = t.raw.toLowerCase();
    if (COPULAS.includes(w)) { sawCopula = true; continue; }
    if (t.candidate && t.candidate.entry.pos === 'v') return null; // an ordinary verb, not a copula
    if (!sawCopula) continue;
    if (w === 'they' || w === 'we') return { gender: 'm', plural: true };
    if (w === 'she') return { gender: 'f', plural: false };
    if (w === 'he' || w === 'it') return { gender: 'm', plural: false };
    const settled = t.candidate?.entry;
    if (settled && settled.pos !== 'n') continue;
    const asNoun = settled
      ? { gender: settled.gender, plural: t.candidate.inflection.number === 'pl' }
      : nounReading(w, index);
    if (asNoun) return asNoun;
  }
  return null;
}

const PREPOSITIONS = ['of', 'in', 'on', 'at', 'for', 'with', 'from', 'by', 'about', 'after', 'before', 'to', 'into', 'over', 'under', 'between', 'through', 'during', 'without'];

/**
 * The subject of the verb at `ti`, skipping over prepositional phrases so that
 * "the plans of the company changed" agrees with plans, not company.
 */
function subject(tokens, ti, index) {
  let steps = 0;
  for (let j = ti - 1; j >= 0 && steps < 8; j--) {
    const t = tokens[j];
    if (t.kind !== 'word') { if (/[.!?;]/.test(t.raw)) return null; continue; }
    steps++;
    const w = t.raw.toLowerCase();
    if (SUBJECTS[w]) return { person: SUBJECTS[w], plural: w === 'we' || w === 'they' };
    // analyze() already settled this word's part of speech in context; trust it
    // over a fresh guess ("lives" after "who" is a verb, not lots of lives).
    const settled = t.candidate?.entry;
    if (settled && settled.pos !== 'n') continue;
    const asNoun = settled
      ? { gender: settled.gender, plural: t.candidate.inflection.number === 'pl' }
      : nounReading(w, index);
    const isNoun = !!asNoun;
    let plural = asNoun?.plural || false;
    // An unknown capitalised word is a name: treat it as a singular subject.
    if (!isNoun && /^\p{Lu}/u.test(t.raw) && !index.byKey.has(w)) {
      const pl = compound(tokens, j, ti, index);
      return { person: pl ? 'pres3p' : 'pres3', plural: pl };
    }
    if (!isNoun) continue;
    // Walk to the head of this noun phrase and see what introduces it.
    let k = j;
    for (let m = j - 1; m >= 0; m--) {
      if (tokens[m].kind !== 'word') { if (!/^[\s,]*$/.test(tokens[m].raw)) break; continue; }
      const mw = tokens[m].raw.toLowerCase();
      if (DETERMINERS[mw] || POSSESSIVES[mw] || isAdjectiveWord(mw, index)) { k = m; continue; }
      break;
    }
    const before = prevWordIndex(tokens, k);
    const beforeWord = before != null ? tokens[before].raw.toLowerCase() : '';
    if (PREPOSITIONS.includes(beforeWord)) { j = before; continue; } // inside a prepositional phrase
    if (compound(tokens, j, ti, index)) plural = true;
    return { person: plural ? 'pres3p' : 'pres3', plural };
  }
  return null;
}

/**
 * A conjoined subject is plural — but only when the "and" really joins two noun
 * phrases. "said good morning and never asked" joins two verbs, and that one
 * stays singular.
 */
function compound(tokens, from, to, index) {
  const nounish = (j) => {
    if (j == null || j < 0 || tokens[j].kind !== 'word') return false;
    const w = tokens[j].raw.toLowerCase();
    if (SUBJECTS[w]) return true;
    if (/^\p{Lu}/u.test(tokens[j].raw) && !index.byKey.has(w)) return true; // a name
    for (const [lemma] of readings(w)) {
      const e = index.byKey.get(lemma);
      if (e) return e.pos === 'n';
    }
    return false;
  };
  const joinsNouns = (m) => {
    const before = prevWordIndex(tokens, m);
    const after = nextWords(tokens, m, 3).find((j) => {
      const w = tokens[j].raw.toLowerCase();
      return !DETERMINERS[w] && !POSSESSIVES[w] && !isAdjectiveWord(w, index);
    });
    return nounish(before) && nounish(after);
  };
  for (let m = from + 1; m < to; m++) {
    if (tokens[m].kind === 'word' && tokens[m].raw.toLowerCase() === 'and' && joinsNouns(m)) return true;
  }
  let seen = 0;
  for (let m = from - 1; m >= 0 && seen < 3; m--) {
    if (tokens[m].kind !== 'word') { if (/[.!?;]/.test(tokens[m].raw)) break; continue; }
    seen++;
    if (tokens[m].raw.toLowerCase() === 'and' && joinsNouns(m)) return true;
  }
  return false;
}

function isAdjectiveWord(word, index) {
  const e = index.byKey.get(word);
  return !!e && (e.pos === 'adj' || e.pos === 'adv');
}

/** Which conjugated form fits: look at auxiliaries and the subject. */
function verbForm(tokens, ti, inflection, index) {
  if (inflection.verbForm === 'ger') return 'ger';
  if (inflection.verbForm === 'part') return 'part';
  const prev = prevWordIndex(tokens, ti);
  const prevWord = prev != null ? tokens[prev].raw.toLowerCase() : '';
  if (['have', 'has', 'had', 'been', 'having'].includes(prevWord)) return 'part';
  if (inflection.verbForm === 'past') {
    const subj = subject(tokens, ti, index);
    return subj && subj.plural ? 'pret3p' : 'pret3';
  }
  if (['to', 'will', 'would', 'can', 'could', 'should', 'must', 'may', 'might', "don't", 'not'].includes(prevWord)) return 'inf';
  if (['have', 'has', 'had', 'been'].includes(prevWord)) return 'part';
  if (['is', 'are', 'was', 'were', 'am'].includes(prevWord)) return 'ger';
  if (inflection.verbForm === 'pres3') return 'pres3';
  if (SUBJECTS[prevWord]) return SUBJECTS[prevWord];
  const subj = subject(tokens, ti, index);
  if (subj) return subj.person;
  return 'pres3';
}

/** Convenience: analyze + apply in one call. */
function weave(text, options = {}, index = DEFAULT_INDEX) {
  return applyLevel(analyze(text, index), options);
}

/** Flatten render nodes back to plain text (for export / TTS). */
function toText(nodes, { hints = false } = {}) {
  return nodes.map((n) => {
    if (n.kind === 'swap') return hints && n.hint ? `${n.text} (${n.hint})` : n.text;
    return n.text;
  }).join('');
}


// ── src/diglot/speech.js ──────────────────────────────────────
// Turning a woven page into something you can listen to.
//
// Reading and listening want different things. On the page you can hover a
// word you don't know; in your ears it has gone by. So the narration adds two
// things the page doesn't need: a spoken gloss the first time each Spanish
// word appears, and control over the silences — before a Spanish word, after
// it, between sentences.
//
// buildNarration() is the single source of truth for how the text divides into
// sentences. The reader renders from it too, so what you see highlighted is
// exactly what is being said.

const NARRATION_DEFAULTS = {
  echo: 'first',      // 'none' | 'first' | 'always' — speak the English gloss
  wordGap: 0,         // ms after each Spanish word (raise it to shadow aloud)
  glossGap: 90,       // ms around a spoken gloss
  sentenceGap: 240,
  paragraphGap: 520,
};

// "Dr. Ramos" is not the end of a sentence.
const ABBREVIATIONS = new Set([
  'mr', 'mrs', 'ms', 'dr', 'prof', 'st', 'mt', 'jr', 'sr', 'vs', 'etc', 'no',
  'fig', 'ave', 'rd', 'inc', 'ltd', 'co', 'approx', 'dept', 'univ', 'est',
]);

const SENTENCE_BOUNDARY = /([.!?…]+["'”’)\]]*)(\s+|$)/g;

function endsSentence(before) {
  const trailing = before.match(/(\S+)$/);
  if (!trailing) return true;
  const word = trailing[1].replace(/[^\p{L}]/gu, '').toLowerCase();
  if (ABBREVIATIONS.has(word)) return false;
  if (word.length === 1 && /\p{Lu}/u.test(trailing[1])) return false; // an initial
  return true;
}

/**
 * Split the rendered nodes into sentences, each with the parts to draw and the
 * runs to speak.
 *
 * A part is what goes on the page: {type:'text'} or {type:'swap'}.
 * A run is what goes to the voice: {lang, text, kind, part, gapAfter}.
 */
function buildNarration(nodes, options = {}) {
  const opts = { ...NARRATION_DEFAULTS, ...options };
  const sentences = [];
  let parts = [];
  let paragraphStart = true;
  // The weaver emits one node per word, so a full stop and the word before it
  // land in different nodes. Keep a short tail of what has already been said
  // so "Dr." can still be recognised as an abbreviation.
  let tail = '';
  let speaker = null;
  const remember = (text) => { tail = (tail + text).slice(-40); };

  const flush = (endsParagraph = false) => {
    const meaningful = parts.some((p) => p.type === 'swap' || p.text.trim());
    if (meaningful) {
      sentences.push({ index: sentences.length, parts, paragraphStart, endsParagraph, speaker });
      paragraphStart = false;
    } else if (parts.length && sentences.length) {
      // whitespace only: keep it on the previous sentence so nothing is lost
      sentences[sentences.length - 1].parts.push(...parts);
    }
    parts = [];
    if (endsParagraph) paragraphStart = true;
  };

  for (const node of nodes) {
    if (node.kind === 'swap') {
      parts.push({ type: 'swap', node });
      remember(node.text);
      continue;
    }
    if (node.speaker) {
      // "Waiter:" — drawn on the page, never spoken; it changes the voice.
      flush(true);
      speaker = node.speaker;
      parts.push({ type: 'speaker', text: node.text, speaker });
      tail = '';
      continue;
    }
    const text = node.text;
    // paragraph breaks first, then sentence ends inside each piece
    const pieces = text.split(/\n{2,}/);
    pieces.forEach((piece, pieceIndex) => {
      if (pieceIndex > 0) flush(true);
      if (!piece) return;
      let cursor = 0;
      SENTENCE_BOUNDARY.lastIndex = 0;
      let match;
      while ((match = SENTENCE_BOUNDARY.exec(piece)) !== null) {
        const end = match.index + match[1].length;
        if (!endsSentence(tail + piece.slice(cursor, match.index))) continue;
        const chunk = piece.slice(cursor, end).replace(/\n/g, ' ');
        parts.push({ type: 'text', text: chunk });
        remember(chunk);
        cursor = end;
        flush(false);
      }
      if (cursor < piece.length) {
        const chunk = piece.slice(cursor).replace(/\n/g, ' ');
        parts.push({ type: 'text', text: chunk });
        remember(chunk);
      }
    });
  }
  flush(true);

  for (const sentence of sentences) sentence.runs = buildRuns(sentence, opts);
  return {
    sentences,
    stats: {
      sentences: sentences.length,
      spanish: sentences.reduce((n, s) => n + s.runs.filter((r) => r.kind === 'word').length, 0),
      glosses: sentences.reduce((n, s) => n + s.runs.filter((r) => r.kind === 'gloss').length, 0),
    },
  };
}

function buildRuns(sentence, opts) {
  const runs = [];
  const pushText = (text) => {
    if (!text) return;
    const last = runs[runs.length - 1];
    if (last && last.kind === 'text' && !last.gapAfter) last.text += text;
    else runs.push({ lang: 'en', kind: 'text', text, gapAfter: 0 });
  };

  sentence.parts.forEach((part, partIndex) => {
    if (part.type === 'speaker') return;      // shown, not said
    if (part.type === 'text') { pushText(part.text); return; }
    const node = part.node;
    // A shadowing gap belongs after a word worth repeating, not between an
    // article and its noun ("la … casa").
    const gap = node.pos === 'det' ? 0 : opts.wordGap;
    runs.push({ lang: 'es', kind: 'word', text: node.text, part: partIndex, gapAfter: gap });

    const wantsGloss = opts.echo === 'always' || (opts.echo === 'first' && node.first);
    const worthGlossing = node.pos !== 'det' && node.en
      && node.en.toLowerCase() !== node.text.toLowerCase();
    if (wantsGloss && worthGlossing) {
      runs[runs.length - 1].gapAfter = Math.max(runs[runs.length - 1].gapAfter, opts.glossGap);
      runs.push({ lang: 'en', kind: 'gloss', text: node.en, part: partIndex, gapAfter: opts.glossGap });
    }
  });

  // trim, and put the between-sentence silence on the last run
  const trimmed = runs.filter((run) => run.text.trim());
  for (const run of trimmed) run.speaker = sentence.speaker || null;
  if (trimmed.length) {
    const last = trimmed[trimmed.length - 1];
    last.gapAfter = Math.max(last.gapAfter, sentence.endsParagraph ? opts.paragraphGap : opts.sentenceGap);
  }
  return trimmed;
}

/**
 * A listen-and-repeat drill from a phrase list: the English, a gap long enough
 * to try it yourself, then the Spanish. Shaped exactly like narration, so the
 * player and the audio export take it without knowing the difference.
 */
function buildDrill(phrases, { gap = 2600, answerGap = 900, repeat = false } = {}) {
  return phrases.map((phrase, index) => {
    const runs = [
      { lang: 'en', kind: 'prompt', text: phrase.en, gapAfter: gap, part: 0, speaker: null },
      { lang: 'es', kind: 'answer', text: phrase.es, gapAfter: repeat ? 500 : answerGap, part: 1, speaker: null },
    ];
    if (repeat) runs.push({ lang: 'es', kind: 'answer', text: phrase.es, gapAfter: answerGap, part: 1, speaker: null });
    return {
      index,
      paragraphStart: true,
      endsParagraph: true,
      speaker: null,
      parts: [{ type: 'prompt', text: phrase.en }, { type: 'answer', text: phrase.es }],
      runs,
    };
  });
}

/** The plain text of a sentence, as it will be spoken. */
function sentenceText(sentence) {
  const glosses = new Map();
  for (const run of sentence.runs) if (run.kind === 'gloss') glosses.set(run.part, run.text);
  return sentence.parts.map((part, i) => {
    if (part.type === 'speaker') return '';
    if (part.type === 'text') return part.text;
    const gloss = glosses.get(i);
    return part.node.text + (gloss ? ` (${gloss})` : '');
  }).join('').replace(/\s+/g, ' ').trim();
}

/**
 * Group runs into as few requests as a remote voice service needs: consecutive
 * runs in the same language become one request, with the pauses carried along
 * so they can be re-inserted as real silence.
 */
function batchRuns(sentences, { maxChars = 900 } = {}) {
  const batches = [];
  let current = null;
  const push = (run, sentenceIndex) => {
    if (current && current.lang === run.lang && current.text.length + run.text.length < maxChars && !current.closed) {
      current.parts.push({ ...run, sentenceIndex });
      current.text += (/\s$/.test(current.text) || /^[\s,.;:!?]/.test(run.text) ? '' : ' ') + run.text;
      current.pendingGap = run.gapAfter;
      if (run.gapAfter >= 400) current.closed = true;
      return;
    }
    current = {
      lang: run.lang, text: run.text, parts: [{ ...run, sentenceIndex }],
      pendingGap: run.gapAfter, closed: run.gapAfter >= 400,
    };
    batches.push(current);
  };
  sentences.forEach((sentence) => sentence.runs.forEach((run) => push(run, sentence.index)));
  return batches.map(({ lang, text, parts }) => ({
    lang,
    text: text.replace(/\s+/g, ' ').trim(),
    gapAfter: parts[parts.length - 1].gapAfter,
    from: parts[0].sentenceIndex,
    to: parts[parts.length - 1].sentenceIndex,
  })).filter((b) => b.text);
}


// ── src/diglot/scenes.js ──────────────────────────────────────
// Everyday scenes: short dialogues for the situations you actually stand in.
//
// The dialogue is English, so the weaver can take it apart and hand it back at
// whatever difficulty you're on. The key phrases underneath are written out in
// full Spanish, because when you are at the till you don't want a word-by-word
// weave — you want the thing people say.
//
// A speaker line is "Name: what they said". The reader styles the name, the
// weaver leaves it alone, and the player gives each speaker their own voice.

const SCENES = [
  {
    id: 'greetings',
    group: 'Everyday',
    title: 'Saying hello',
    blurb: 'Hello, goodbye, and the bit in the middle.',
    turns: [
      ['You', 'Good morning.'],
      ['Neighbour', 'Good morning. How are you?'],
      ['You', 'Very well, thank you. And you?'],
      ['Neighbour', 'Fine. Are you the new neighbour?'],
      ['You', 'Yes. My name is Kareem. Nice to meet you.'],
      ['Neighbour', 'Nice to meet you too. I am Elena. I live on the second floor.'],
      ['You', 'I am from Ireland. I do not speak much Spanish yet.'],
      ['Neighbour', 'You speak very well. More than you think.'],
      ['You', 'Thank you very much. See you tomorrow.'],
      ['Neighbour', 'See you tomorrow. Have a good day.'],
    ],
    phrases: [
      { en: 'Good morning.', es: 'Buenos días.' },
      { en: 'How are you?', es: '¿Qué tal?' },
      { en: 'Very well, thank you. And you?', es: 'Muy bien, gracias. ¿Y tú?' },

/** The dialogue as text the weaver can chew on. */
function sceneToText(scene) {
  return scene.turns.map(([speaker, line]) => `${speaker}: ${line}`).join('\n\n');
}

/** Scenes grouped for the picker, in the order defined above. */
function sceneGroups(scenes = SCENES) {
  const groups = new Map();
  for (const scene of scenes) {
    if (!groups.has(scene.group)) groups.set(scene.group, []);
    groups.get(scene.group).push(scene);
  }
  return [...groups].map(([name, items]) => ({ name, scenes: items }));
}

/** Every phrase in the book, for a drill across the lot. */
function allPhrases(scenes = SCENES) {
  const seen = new Set();
  const out = [];
  for (const scene of scenes) {
    for (const phrase of scene.phrases) {
      const key = phrase.es.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({ ...phrase, scene: scene.title });
    }
  }
  return out;
}


// ── src/diglot/tts.js ─────────────────────────────────────────
// Rendering a woven page to an audio file.
//
// The browser's own voices are free and instant but cannot be recorded — the
// Web Speech API gives you sound, not samples. So for a file you can put on a
// phone, this calls a cloud voice service with your own key.
//
// Each run goes to the voice of its own language, which is the whole point:
// send the diglot sentence to one voice and it reads "la casa" with an English
// accent. Same-language runs that sit next to each other are merged into one
// request to keep the call count (and the bill) down.


const PROVIDERS = {
  google: {
    id: 'google',
    label: 'Google Cloud Text-to-Speech',
    keyLabel: 'API key',
    keyHint: 'An API key from a Google Cloud project with the Text-to-Speech API enabled. Cheapest of the two, and the only one here that can place exact silences.',
    exactSilence: true,
    defaults: { es: 'es-ES-Neural2-B', en: 'en-GB-Neural2-B' },
  },
  elevenlabs: {
    id: 'elevenlabs',
    label: 'ElevenLabs',
    keyLabel: 'API key',
    keyHint: 'Best-sounding of the two, and its multilingual voices handle both languages. Pauses come out as natural phrasing rather than exact silence.',
    exactSilence: false,
    defaults: { es: '', en: '' },
  },
};

const escapeSsml = (s) => s.replace(/[<>&"']/g, (c) => (
  { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));

/**
 * Turn narration into an ordered list of voice requests. Pure — the tests run
 * it without touching the network.
 */
function planRequests(sentences, { provider = 'google', maxChars = 900 } = {}) {
  const exact = PROVIDERS[provider]?.exactSilence;
  return batchRuns(sentences, { maxChars }).map((batch) => {
    const gap = batch.gapAfter || 0;
    let text = batch.text;
    let ssml = null;
    if (exact && gap >= 60) {
      ssml = `<speak>${escapeSsml(text)}<break time="${Math.round(gap)}ms"/></speak>`;
    } else if (gap >= 400) {
      // No break tag to lean on: ask for the pause with punctuation instead.
      text = text.replace(/[\s.]*$/, '') + '…';
    }
    return { lang: batch.lang, text, ssml, gapAfter: gap, from: batch.from, to: batch.to };
  });
}

/** Join audio chunks. MP3 is a stream of self-contained frames, so appending works. */
function concatBytes(chunks) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(total);
  let at = 0;
  for (const chunk of chunks) { out.set(chunk, at); at += chunk.length; }
  return out;
}

const base64ToBytes = (b64) => {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
};

// ── providers ───────────────────────────────────────────────────────────────

async function googleSynthesize(request, { apiKey, voices, rate, signal }) {
  const voice = voices[request.lang] || PROVIDERS.google.defaults[request.lang];
  const languageCode = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [request.lang === 'es' ? 'es-ES' : 'en-GB'])[0];
  const res = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${encodeURIComponent(apiKey)}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    signal,
    body: JSON.stringify({
      input: request.ssml ? { ssml: request.ssml } : { text: request.text },
      voice: { languageCode, name: voice },
      audioConfig: { audioEncoding: 'MP3', speakingRate: rate || 1 },
    }),
  });
  if (!res.ok) throw new Error(await describeError(res));
  const body = await res.json();
  if (!body.audioContent) throw new Error('Google returned no audio');
  return base64ToBytes(body.audioContent);
}

async function googleVoices({ apiKey, signal }) {
  const res = await fetch(`https://texttospeech.googleapis.com/v1/voices?key=${encodeURIComponent(apiKey)}`, { signal });
  if (!res.ok) throw new Error(await describeError(res));
  const body = await res.json();
  return (body.voices || []).map((v) => ({
    id: v.name,
    name: `${v.name} (${v.ssmlGender?.toLowerCase() || '—'})`,
    lang: (v.languageCodes || [''])[0],
  }));
}

async function elevenSynthesize(request, { apiKey, voices, signal }) {
  const voice = voices[request.lang];
  if (!voice) throw new Error(`Pick an ElevenLabs voice for ${request.lang === 'es' ? 'Spanish' : 'English'} first`);
  const res = await fetch(
    `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voice)}?output_format=mp3_44100_128`,
    {
      method: 'POST',
      headers: { 'xi-api-key': apiKey, 'content-type': 'application/json' },
      signal,
      body: JSON.stringify({
        text: request.text,
        model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.5, similarity_boost: 0.75 },
      }),
    },
  );
  if (!res.ok) throw new Error(await describeError(res));
  return new Uint8Array(await res.arrayBuffer());
}

async function elevenAccountVoices({ apiKey, signal }) {
  const res = await fetch('https://api.elevenlabs.io/v1/voices', { headers: { 'xi-api-key': apiKey }, signal });
  if (!res.ok) throw new Error(await describeError(res));
  const body = await res.json();
  return (body.voices || []).map((v) => ({
    id: v.voice_id,
    name: v.name + (v.labels?.accent ? ` — ${v.labels.accent}` : ''),
    lang: '',
  }));
}

async function describeError(res) {
  let detail = `${res.status} ${res.statusText}`;
  try {
    const body = await res.json();
    detail = body?.error?.message || body?.detail?.message || body?.detail || detail;
  } catch { /* keep the status line */ }
  return typeof detail === 'string' ? detail : JSON.stringify(detail);
}

const IMPLEMENTATIONS = {
  google: { synthesize: googleSynthesize, voices: googleVoices },
  elevenlabs: { synthesize: elevenSynthesize, voices: elevenAccountVoices },
};

function listVoices(provider, options) {
  const impl = IMPLEMENTATIONS[provider];
  if (!impl) throw new Error(`Unknown voice service: ${provider}`);
  return impl.voices(options);
}

/** Run tasks with a small amount of parallelism, keeping results in order. */
async function mapWithLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (next < items.length) {
      const index = next++;
      results[index] = await fn(items[index], index);
    }
  });
  await Promise.all(workers);
  return results;
}

/**
 * Render narration to a single MP3.
 * Returns { blob, requests, characters } — characters is what you'll be billed on.
 */
async function renderAudio(sentences, {
  provider = 'google', apiKey, voices = {}, rate = 1, concurrency = 4, onProgress, signal,
} = {}) {
  const impl = IMPLEMENTATIONS[provider];
  if (!impl) throw new Error(`Unknown voice service: ${provider}`);
  if (!apiKey) throw new Error('Add an API key for the voice service first');

  const requests = planRequests(sentences, { provider });
  if (!requests.length) throw new Error('Nothing to read');

  let done = 0;
  const chunks = await mapWithLimit(requests, concurrency, async (request) => {
    const bytes = await impl.synthesize(request, { apiKey, voices, rate, signal });
    done += 1;
    onProgress?.({ done, total: requests.length });
    return bytes;
  });

  return {
    blob: new Blob([concatBytes(chunks)], { type: 'audio/mpeg' }),
    requests: requests.length,
    characters: requests.reduce((n, r) => n + r.text.length, 0),
  };
}

/** What a render will cost you, before you start it. */
function estimate(sentences, { provider = 'google' } = {}) {
  const requests = planRequests(sentences, { provider });
  const characters = requests.reduce((n, r) => n + r.text.length, 0);
  return { requests: requests.length, characters, minutes: Math.round((characters / 950) * 10) / 10 };
}

const esArticle = article;
